# The coordinator service on top of the recorder bot's JWT test deployment (docker-jitsi-meet with token
# authentication, the fork's web build and the recorder bot). Not for production. Start it from this directory:
#
#   docker compose -f ../../recorder-bot/test-deployment/docker-compose.yml \
#       -f ../../recorder-bot/test-deployment/docker-compose.jwt.yml -f docker-compose.yml up -d
#
# Generate the keys first with keys/generate-keys.sh. See README.md. Relative paths below are relative to the first
# file's directory, recorder-bot/test-deployment.
services:
    web:
        environment:
            # Breakout rooms are disabled (ADR 0007); deep linking too, so that a phone opens the link in its browser
            # (ADR 0010; the recorder bot's test deployment already disables it).
            ENABLE_BREAKOUT_ROOMS: 'false'
        volumes:
            # Prosody fetches the coordinator service's public key from here:
            # http://web/.well-known/coordinator/<sha256 of the key id>.pem.
            - ../../coordinator/test-deployment/keys/asap:/usr/share/jitsi-meet/.well-known/coordinator:ro
            # Proxies /coordinator/ to the coordinator service over this server's TLS (ADR 0008).
            - ../../coordinator/deploy/nginx/coordinator.conf:/config/nginx-custom/coordinator.conf:ro
            # Marks patients for the client, which hides the buttons that end a patient's room or remove the patient.
            - ../../coordinator/test-deployment/custom-config.js:/config/custom-config.js:ro
            # The waiting videos, at /videos/ (run videos/generate.sh first).
            - ../../coordinator/test-deployment/videos:/usr/share/jitsi-meet/videos:ro
            - ../../coordinator/test-deployment/videos.conf:/config/nginx-custom/videos.conf:ro

    prosody:
        # Prosody's HTTP port (5280) is exposed on the internal network only, for the coordinator service.
        volumes:
            - ../../resources/prosody-plugins/mod_coordinator_api.lua:/prosody-plugins-custom/mod_coordinator_api.lua:ro
            - ../../resources/prosody-plugins/mod_muc_require_move_support.lua:/prosody-plugins-custom/mod_muc_require_move_support.lua:ro
            - ../../resources/prosody-plugins/mod_muc_patient_never_moderator.lua:/prosody-plugins-custom/mod_muc_patient_never_moderator.lua:ro
            - ../../resources/prosody-plugins/patient_marker.lib.lua:/prosody-plugins-custom/patient_marker.lib.lua:ro
            # Refuses the end of a patient's room for everyone; reads the MUC component's muc_patient_marker.
            - ../../resources/prosody-plugins/mod_end_conference.lua:/prosody-plugins-custom/mod_end_conference.lua:ro
        environment:
            ENABLE_BREAKOUT_ROOMS: 'false'
            # Refuses a client that does not announce that it obeys moves, apart from the hosts listed in
            # muc_require_move_support_exempt_hosts: the auth domain (Jicofo) and the recorder bot's hidden domain
            # (ADR 0010). The guest domain is not exempt. This replaces the JWT variant's XMPP_MUC_CONFIGURATION,
            # so it repeats the token verification allowlist.
            # Keeps patients, by the same marker as the coordinator service's, out of the moderator role in every
            # room: Jicofo makes everyone with a token a moderator.
            XMPP_MUC_MODULES: muc_require_move_support,muc_patient_never_moderator
            XMPP_MUC_CONFIGURATION: |
                token_verification_allowlist = { "${XMPP_HIDDEN_DOMAIN}" }
                muc_require_move_support_exempt_hosts = { "auth.meet.jitsi"; "${XMPP_HIDDEN_DOMAIN}" }
                muc_patient_marker = "user.hospital_role=patient"
            # The guest domain exists so that webOnly.spec.ts can check that it is not exempt.
            ENABLE_GUESTS: '1'
            XMPP_MODULES: presence_identity,coordinator_api
            XMPP_CONFIGURATION: coordinator_api_key_server = "http://web/.well-known/coordinator"
            # Also accepts the tokens the coordinator service issues for a move (ADR 0009). The service's public key
            # is in the same key server as the tests' own (keys/generate-keys.sh copies it to the JWT variant's).
            JWT_ACCEPTED_ISSUERS: chat,coordinator

    jicofo:
        environment:
            ENABLE_BREAKOUT_ROOMS: 'false'
            ENABLE_GUESTS: '1'

    recorder-bot:
        environment:
            # Room for the specs that record at the same time.
            RECORDER_BOT_MAX_CONSULTATIONS: 12
            # Records the video player under its own role.
            RECORDER_BOT_VIDEO_PLAYER_MARKER: user.hospital_role=video_player
            # Sends heartbeats to the coordinator service through the web server's TLS (ADR 0014), as the first of the
            # two recorder bot workers. The secret is the one it has in workers.json. The coordinator service reaches
            # its control API at the advertised address; set WORKER_ADDRESS where host.docker.internal is not the host.
            RECORDER_BOT_ID: recorder-bot-1
            RECORDER_BOT_ADVERTISED_URL: http://${WORKER_ADDRESS:-host.docker.internal}:8090
            RECORDER_BOT_HEARTBEAT_URL: https://localhost:8443/coordinator
            RECORDER_BOT_BUILD: ${BUILD:-test-deployment}
            # The web server's certificate here is self-signed; the worker only reaches this test server with it.
            NODE_TLS_REJECT_UNAUTHORIZED: '0'

    # The second recorder bot worker: its own spool and secret, the evidence storage root shared with the first.
    recorder-bot-2:
        extends:
            file: docker-compose.yml
            service: recorder-bot
        volumes:
            - ./spool/second:/var/lib/recorder-bot/spool
        environment:
            RECORDER_BOT_API_PORT: 8095
            RECORDER_BOT_API_SECRET: recorder-bot-2-test-secret
            RECORDER_BOT_MAX_CONSULTATIONS: 12
            RECORDER_BOT_VIDEO_PLAYER_MARKER: user.hospital_role=video_player
            RECORDER_BOT_ID: recorder-bot-2
            RECORDER_BOT_ADVERTISED_URL: http://${WORKER_ADDRESS:-host.docker.internal}:8095
            RECORDER_BOT_HEARTBEAT_URL: https://localhost:8443/coordinator
            RECORDER_BOT_BUILD: ${BUILD:-test-deployment}
            NODE_TLS_REJECT_UNAUTHORIZED: '0'

    video-player:
        image: video-player:local
        build: ../../video-player
        restart: unless-stopped
        init: true
        ipc: host
        # On the host network, like the recorder bot: its Chromium reaches the web server on localhost and the
        # videobridge on its advertised 127.0.0.1. Port 8094, as 8090 to 8093 are the recorder bot services'.
        network_mode: host
        environment:
            VIDEO_PLAYER_API_PORT: 8094
            VIDEO_PLAYER_API_SECRET: video-player-test-secret
            VIDEO_PLAYER_JITSI_URL: https://localhost:8443
            VIDEO_PLAYER_IGNORE_CERTIFICATE_ERRORS: 'true'
            VIDEO_PLAYER_MAX_ROOMS: 3
            # Sends heartbeats like the recorder bots (ADR 0014); the secret is the one it has in workers.json.
            VIDEO_PLAYER_ID: video-player-1
            VIDEO_PLAYER_ADVERTISED_URL: http://${WORKER_ADDRESS:-host.docker.internal}:8094
            VIDEO_PLAYER_HEARTBEAT_URL: https://localhost:8443/coordinator
            VIDEO_PLAYER_BUILD: ${BUILD:-test-deployment}
            NODE_TLS_REJECT_UNAUTHORIZED: '0'

    coordinator:
        image: coordinator:local
        build: ../../coordinator
        restart: unless-stopped
        # On the internal network only, and no port is published: the web server proxies /coordinator/ to port 8091
        # (ADR 0008). Never add a "ports" entry here. The recorder bot is on the host network, so the service reaches
        # it through the host gateway.
        networks:
            meet.jitsi:
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - coordinator-data:/var/lib/coordinator
            - ../../coordinator/test-deployment/keys/private.pem:/run/keys/private.pem:ro
            - ../../coordinator/test-deployment/rooms.json:/etc/coordinator/rooms.json:ro
            # The hospital issuer's public keys, which sign the coordinators in to the screen.
            - ../../recorder-bot/test-deployment/jwt/asap:/etc/coordinator/issuer-keys:ro
            # The workers' ids and secrets, read again whenever the file changes: edit it in place, no restart.
            - ../../coordinator/test-deployment/workers.json:/etc/coordinator/workers.json:ro
        environment:
            COORDINATOR_API_SECRET: coordinator-test-secret
            # The pipeline's own secret: it alone sets a worker draining.
            COORDINATOR_PIPELINE_SECRET: coordinator-pipeline-test-secret
            COORDINATOR_PATIENT_MARKER: user.hospital_role=patient
            # The retention sweep runs every 2 seconds, for the retention test; production sweeps hourly.
            COORDINATOR_RETENTION_SWEEP_SECONDS: 2
            COORDINATOR_PROSODY_URL: http://prosody:5280
            COORDINATOR_ISSUER_KEYS: /etc/coordinator/issuer-keys
            COORDINATOR_ROOMS_FILE: /etc/coordinator/rooms.json
            # The workers send heartbeats; the coordinator service hands them work (ADR 0014).
            COORDINATOR_WORKER_SECRETS_FILE: /etc/coordinator/workers.json
            COORDINATOR_SIGNING_KEY_FILE: /run/keys/private.pem
            COORDINATOR_SIGNING_KID: coordinator-test/key
            COORDINATOR_STAFF_MARKER: user.hospital_role=staff
            COORDINATOR_TOKEN_SUBJECT: coordinator-test
            COORDINATOR_VIDEO_BASE_URL: https://localhost:8443/
            COORDINATOR_VIDEO_PLAYER_MARKER: user.hospital_role=video_player
        depends_on:
            - recorder-bot
            - recorder-bot-2
            - video-player
            - prosody

volumes:
    coordinator-data:
