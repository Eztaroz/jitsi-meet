# Proxies /coordinator/ to the coordinator service over the web server's TLS (ADR 0008). The service speaks plain HTTP
# and is reachable only on the deployment's internal network: its port must never be published.
#
# The coordinator opens https://<deployment>/coordinator/screen and the hospital's system calls
# https://<deployment>/coordinator/...; the prefix is stripped, so the service sees /screen, /encounters, /moves.
#
# Include this at server level. The docker-jitsi-meet web image includes /config/nginx-custom/*.conf there. Change
# "coordinator:8091" to the service's name and port on the internal network.
location = /coordinator {
    return 301 /coordinator/screen;
}

location /coordinator/ {
    # Docker's resolver, asked when a request arrives, so that nginx starts even while the service is down.
    resolver 127.0.0.11 valid=10s;
    set $coordinator_service http://coordinator:8091;

    rewrite ^/coordinator/(.*)$ /$1 break;
    proxy_pass $coordinator_service;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
