<!doctype html>
<!--
    PROTOTYPE, throwaway. Not part of the coordinator's screen and never served: screenRoutes.ts serves only the files
    it names. Open this file straight in a browser (double-click it).

    Question it answers: what should the coordinator screen's queue view look like?
    Three variants of the queue view, switchable via `?variant=A|B|C` and the floating bar at the bottom.
    Settled before the prototype (grilling, 2026-11-25) and shared by every variant: one-line header with the figures
    and an NHSO chip, a "queue" view and a "rooms and moves" view, a slim team strip, columns per stage with empty
    ones collapsed, compact tickets with one primary action, the rest in a panel on the right, an "attention" strip
    on top, and the attention count in the tab's title.
    What the variants disagree on: the shape of a ticket, how the attention strip reads, and how the detail panel sits.
    All data is fake and lives in memory; every action only changes that memory.
-->
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>หน้าจอผู้ประสานงาน</title>
    <link rel="stylesheet" href="screen.css">
    <style>
        /* ---------- Readable for users aged 45 and over: Niramit, larger type, light theme only, higher contrast ---------- */
        /* Niramit is self-hosted: the real screen may load nothing but its own files. Licence: fonts/OFL.txt. */
        @font-face { font-family: 'Niramit'; font-weight: 400; font-display: swap; src: url('fonts/Niramit-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'Niramit'; font-weight: 500; font-display: swap; src: url('fonts/Niramit-Medium.ttf') format('truetype'); }
        @font-face { font-family: 'Niramit'; font-weight: 600; font-display: swap; src: url('fonts/Niramit-SemiBold.ttf') format('truetype'); }
        @font-face { font-family: 'Niramit'; font-weight: 700; font-display: swap; src: url('fonts/Niramit-Bold.ttf') format('truetype'); }

        /* Declared after screen.css and without a media query, so these win over its dark tokens too: one light theme. */
        :root {
            color-scheme: light;
            --bg: #eef1f5;
            --surface: #fff;
            --surface-2: #f5f7fa;
            --surface-3: #e8ecf2;
            --text: #0d1722;
            --muted: #36414f;
            --faint: #4f5b6a;
            --line: #cfd6e0;
            --line-strong: #9aa7b7;
            --accent: #0b4fb3;
            --accent-hover: #083f90;
            --accent-soft: #e3edfc;
            --on-accent: #fff;
            --ok: #0b6a3a;
            --ok-soft: #dcf2e5;
            --warn: #8a4700;
            --warn-soft: #ffeccc;
            --danger: #b01e17;
            --danger-soft: #fde4e2;
            --lounge: #5f33a8;
            --lounge-soft: #ede4fb;
            --shadow-sm: 0 1px 2px rgb(13 23 34 / 8%);
            --shadow-lg: 0 12px 32px -8px rgb(13 23 34 / 28%);
        }
        html { font-size: 18px; }
        body { font: 400 1rem/1.55 'Niramit', 'Leelawadee UI', 'Segoe UI', system-ui, sans-serif; letter-spacing: .005em; }
        h1 { font-size: 1.25rem; }
        .tagline { font-size: .92rem; }
        .badge, .count, .live { font-size: .88rem; font-weight: 600; }
        .badge { padding: 1px 9px; }
        button, select, input { font: inherit; font-size: 1rem; }
        button { min-height: 2.4rem; font-weight: 600; }
        .segmented button { font-size: 1rem; min-height: 2.2rem; padding: 4px 16px; }
        .avatar { height: 2.2rem; width: 2.2rem; font-size: .95rem; }
        .i { height: 1.2em; width: 1.2em; }

        /* ---------- Shared frame: header, views, team strip, board grid ---------- */
        body { overflow-x: hidden; }
        .topbar { gap: 16px; padding-left: 20px; padding-right: 20px; }
        .pv-figures { align-items: center; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .92rem; color: var(--muted); }
        .pv-figures b { color: var(--text); font-variant-numeric: tabular-nums; font-size: .95rem; }
        .pv-figure { align-items: center; display: inline-flex; gap: 5px; }
        .pv-figure .i { height: 15px; width: 15px; }
        .pv-chip { align-items: center; border: 1px solid var(--line); border-radius: 999px; display: inline-flex; font-size: .88rem; font-weight: 600; gap: 6px; padding: 3px 10px; background: var(--surface); position: relative; }
        .pv-chip[data-on='true'] { background: var(--warn); border-color: transparent; color: var(--on-accent); }
        .pv-chip .i { height: 14px; width: 14px; }
        .pv-pop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); color: var(--text); font-weight: 400; padding: 12px; position: absolute; right: 0; top: calc(100% + 6px); width: 280px; z-index: 30; }
        .pv-pop p { margin: 0 0 8px; font-size: .88rem; }
        .pv-head-right { align-items: center; display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: flex-end; }
        .pv-views { margin-left: 8px; }

        main.pv-main { max-width: none; padding: 14px 20px 90px; }
        .pv-teams { align-items: center; display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
        .pv-teams-label { color: var(--muted); font-size: .88rem; font-weight: 600; margin-right: 4px; }
        .pv-team { align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; display: inline-flex; font-size: .88rem; gap: 6px; padding: 2px 10px; position: relative; }
        .pv-team .free { color: var(--ok); font-weight: 700; }
        .pv-team .busy { color: var(--muted); }
        .pv-team .pv-pop { left: 0; right: auto; cursor: default; }

        .pv-work { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
        .pv-board { display: grid; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
        .pv-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); min-width: 0; }
        .pv-col-head { align-items: center; border-bottom: 1px solid var(--line); display: flex; font-size: .92rem; font-weight: 700; gap: 6px; padding: 8px 10px; }
        .pv-col-head .count { margin-left: auto; }
        .pv-col-head .i { color: var(--muted); height: 15px; width: 15px; }
        .pv-col.collapsed { background: var(--surface-2); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 8px; color: var(--faint); }
        .pv-col.collapsed .pv-vname { writing-mode: vertical-rl; font-size: .88rem; font-weight: 600; }
        .pv-col-body { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
        .pv-doctor { color: var(--muted); font-size: .92rem; font-weight: 700; margin: 4px 2px 0; display: flex; gap: 6px; }
        .pv-doctor.none { color: var(--warn); }
        .pv-hn { font-variant-numeric: tabular-nums; font-weight: 700; }
        .pv-hn-link { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
        .pv-wait { font-size: .88rem; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
        [data-tier='warn'] .pv-wait { color: var(--warn); font-weight: 700; }
        [data-tier='long'] .pv-wait { color: var(--danger); font-weight: 700; }
        .pv-go { padding: 3px 9px; font-size: .88rem; white-space: nowrap; }
        .pv-selected { box-shadow: 0 0 0 3px var(--accent) !important; position: relative; z-index: 1; }
        .pv-flag { outline: 2px solid color-mix(in srgb, var(--danger) 60%, transparent); }

        /* Detail panel (shared contents; each variant places it differently) */
        .pv-panel { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .pv-panel-head { align-items: center; border-bottom: 1px solid var(--line); display: flex; gap: 10px; padding: 12px 14px; }
        .pv-panel-head .pv-hn { font-size: 1.2rem; }
        .pv-panel-head .close { margin-left: auto; }
        .pv-panel-body { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 14px; }
        .pv-field { display: grid; gap: 6px; }
        .pv-field > span { color: var(--muted); font-size: .88rem; font-weight: 700; }
        .pv-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .pv-row > select, .pv-row > input { flex: 1 1 140px; min-width: 0; }
        .pv-row input { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); color: var(--text); font: inherit; padding: 6px 10px; }
        .pv-q { border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: .92rem; padding: 8px 10px; }
        .pv-q .state { color: var(--muted); font-size: .92rem; }
        .pv-q ol { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
        .pv-badges { display: flex; flex-wrap: wrap; gap: 4px; }
        .badge.nhso-not_yet { background: var(--warn-soft); color: var(--warn); }
        .badge.nhso-unavailable { background: var(--danger-soft); color: var(--danger); }
        .badge.nhso-authenticated, .badge.nhso-bypassed { background: var(--ok-soft); color: var(--ok); }
        .badge.video { background: var(--accent-soft); color: var(--accent); }

        .pv-rooms { border: 2px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); padding: 40px; text-align: center; }

        /* ---------- Variant A: calm board. Cards, badges on a second line, attention as chips, panel as an overlay drawer ---------- */
        .vA .pv-col-body { gap: 8px; }
        .vA .pv-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); cursor: pointer; display: grid; gap: 4px; padding: 8px 10px; }
        .vA .pv-card:hover { border-color: var(--line-strong); }
        .vA .pv-card-line { align-items: center; display: flex; gap: 8px; min-width: 0; }
        .vA .pv-pos { color: var(--faint); font-size: .88rem; font-variant-numeric: tabular-nums; width: 14px; }
        .vA .pv-card-line .pv-waitbox { margin-left: auto; }
        .vA .pv-card .badge { font-size: .92rem; }
        .vA [data-tier='long'].pv-card { border-left: 4px solid var(--danger); }
        .vA [data-tier='warn'].pv-card { border-left: 4px solid var(--warn); }
        .vA .pv-attn { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .vA .pv-attn-chip { align-items: center; border-radius: 999px; display: inline-flex; font-size: .88rem; font-weight: 600; gap: 6px; padding: 4px 6px 4px 12px; cursor: pointer; border: 1px solid transparent; }
        .vA .pv-attn-chip[data-sev='high'] { background: var(--danger-soft); color: var(--danger); }
        .vA .pv-attn-chip[data-sev='mid'] { background: var(--warn-soft); color: var(--warn); }
        .vA .pv-attn-chip .x { background: none; border: 0; color: inherit; padding: 0 4px; cursor: pointer; }
        .vA .pv-attn-chip:not(:has(.x)) { padding-right: 12px; }
        .vA .pv-panel { border-radius: var(--radius) 0 0 var(--radius); bottom: 0; position: fixed; right: 0; top: 0; width: 26rem; z-index: 40; }
        .vA .pv-scrim { background: rgb(0 0 0 / 18%); inset: 0; position: fixed; z-index: 35; }

        /* ---------- Variant B: dense ledger. Strict one-line rows, icon dots, attention as a list, panel docked ---------- */
        .vB .pv-col-body { gap: 0; padding: 0; }
        .vB .pv-line { align-items: center; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 6px; grid-template-columns: 1.3rem minmax(0, 1fr) auto auto 2.4rem; font-size: .92rem; padding: 4px 8px; }
        .vB .pv-line:hover { background: var(--surface-2); }
        .vB .pv-line:last-child { border-bottom: 0; }
        .vB .pv-pos { color: var(--faint); font-size: .92rem; text-align: right; }
        .vB .pv-dots { display: flex; gap: 3px; }
        .vB .pv-dot { border-radius: 50%; height: .7rem; width: .7rem; }
        .vB .pv-dot.next { background: var(--ok); }
        .vB .pv-dot.at { background: var(--lounge); }
        .vB .pv-dot.nhso-not_yet { background: var(--warn); }
        .vB .pv-dot.nhso-unavailable { background: var(--danger); }
        .vB .pv-dot.video { background: var(--accent); }
        .vB .pv-go { padding: 2px 0; width: 2.4rem; justify-content: center; }
        .vB [data-tier='long'].pv-line { background: var(--danger-soft); }
        .vB .pv-doctor { border-bottom: 1px solid var(--line); margin: 0; padding: 4px 8px; background: var(--surface-2); }
        .vB .pv-attn { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--danger); border-radius: var(--radius-sm); margin-top: 10px; }
        .vB .pv-attn summary { cursor: pointer; font-size: .92rem; font-weight: 700; padding: 8px 12px; }
        .vB .pv-attn ul { display: grid; gap: 0 24px; grid-template-columns: repeat(auto-fill, minmax(24rem, 1fr)); list-style: none; margin: 0; padding: 0 12px 8px; }
        .vB .pv-attn li { align-items: center; border-top: 1px solid var(--line); display: flex; font-size: .88rem; gap: 8px; padding: 4px 0; cursor: pointer; }
        .vB .pv-attn li .sev { border-radius: 50%; flex: none; height: .7rem; width: .7rem; }
        .vB .pv-attn li[data-sev='high'] .sev { background: var(--danger); }
        .vB .pv-attn li[data-sev='mid'] .sev { background: var(--warn); }
        .vB .pv-attn li .x { margin-left: auto; padding: 0 8px; font-size: .92rem; }
        .vB .pv-legend { color: var(--muted); display: flex; flex-wrap: wrap; font-size: .92rem; gap: 4px 12px; margin: 6px 0 0; }
        .vB .pv-legend span { align-items: center; display: inline-flex; gap: 4px; }
        .vB .pv-work.has-panel { grid-template-columns: minmax(0, 1fr) 24rem; }
        .vB .pv-panel { border-radius: var(--radius-sm); box-shadow: none; position: sticky; top: 12px; max-height: calc(100vh - 24px); }

        /* ---------- Variant C: heat tiles. Tiles coloured by wait, attention as a banner, panel as a tabbed sheet ---------- */
        .vC .pv-tiles { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); }
        .vC .pv-tile { background: var(--ok-soft); border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; display: grid; gap: 2px; min-height: 5rem; padding: 6px 8px; position: relative; }
        .vC [data-tier='warn'].pv-tile { background: var(--warn-soft); }
        .vC [data-tier='long'].pv-tile { background: #c0281f; color: #fff; }
        .vC [data-tier='long'].pv-tile .pv-wait { color: #fff; }
        .vC .pv-tile .pv-hn { font-size: .92rem; }
        .vC .pv-tile .pv-wait { font-size: 1.15rem; }
        .vC .pv-tile .pv-pos { color: var(--faint); font-size: .92rem; position: absolute; right: 7px; top: 5px; }
        .vC [data-tier='long'].pv-tile .pv-pos { color: #fff; }
        .vC .pv-corner { display: flex; gap: 3px; }
        .vC .pv-corner i { border: 1.5px solid currentColor; border-radius: 3px; font-size: .92rem; font-style: normal; font-weight: 700; line-height: 1; padding: 1px 3px; }
        .vC .pv-tile .pv-go { bottom: 5px; opacity: 0; position: absolute; right: 5px; padding: 2px 6px; }
        .vC .pv-tile:hover .pv-go, .vC .pv-tile:focus-within .pv-go { opacity: 1; }
        .vC .pv-banner { align-items: center; background: #c0281f; border-radius: var(--radius); color: #fff; display: flex; gap: 18px; margin-top: 10px; padding: 10px 16px; }
        .vC .pv-banner.calm { background: var(--ok-soft); color: var(--ok); }
        .vC .pv-banner .big { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
        .vC .pv-banner .first { flex: 1; font-size: .92rem; }
        .vC .pv-banner button { background: rgb(255 255 255 / 18%); border-color: transparent; color: inherit; }
        .vC .pv-banner-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-top: 6px; padding: 6px 10px; display: grid; gap: 4px; font-size: .92rem; }
        .vC .pv-banner-list div { cursor: pointer; display: flex; gap: 8px; align-items: center; }
        .vC .pv-banner-list .x { margin-left: auto; padding: 0 8px; font-size: .92rem; }
        .vC .pv-work.has-panel { grid-template-columns: minmax(0, 1fr) 25rem; }
        .vC .pv-panel { border-radius: var(--radius); position: sticky; top: 12px; max-height: calc(100vh - 24px); }
        .vC .pv-tabs { display: flex; border-bottom: 1px solid var(--line); }
        .vC .pv-tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; flex: 1; background: none; }
        .vC .pv-tabs button[aria-pressed='true'] { border-bottom-color: var(--accent); color: var(--accent); }

        /* ---------- The prototype's own switcher: deliberately not part of any design ---------- */
        .pv-switch { align-items: center; background: #111; border-radius: 999px; bottom: 16px; box-shadow: 0 8px 30px rgb(0 0 0 / 40%); color: #fff; display: flex; font: 13px/1.3 system-ui, sans-serif; gap: 10px; left: 16px; padding: 6px 8px; position: fixed; z-index: 100; white-space: nowrap; }
        .pv-switch button { background: #2a2a2a; border: 0; border-radius: 999px; color: #fff; font: inherit; padding: 5px 10px; min-height: 0; }
        .pv-switch button:hover { background: #444; }
        .pv-switch button[aria-pressed='true'] { background: #f5c518; color: #111; }
        .pv-switch .label { font-weight: 700; min-width: 150px; text-align: center; }
        .pv-switch .state { color: #aaa; font-size: 12px; }
        .pv-switch .sep { background: #444; height: 18px; width: 1px; }

        /* ---------- Spacing pass for 18px Niramit: Thai vowels above and below need taller lines and roomier boxes ---------- */
        /* In rem, so the spacing grows with the type. Declared last, so it wins over the spacing above. */
        .topbar { gap: 1.5rem; padding: .75rem 1.5rem; }
        .pv-head-right { gap: .6rem 1.1rem; }
        .pv-figures { gap: .4rem 1.25rem; }
        .pv-figure { gap: .35rem; }
        .pv-chip { gap: .45rem; padding: .3rem .9rem; }
        .pv-pop { padding: 1rem; width: 20rem; }
        .pv-pop p { line-height: 1.6; margin: 0 0 .6rem; }
        .pv-views { margin-left: 1rem; }
        main.pv-main { padding: 1.1rem 1.5rem 7rem; }
        .pv-teams { gap: .5rem; margin: 1.1rem 0 1rem; }
        .pv-teams-label { margin-right: .25rem; }
        .pv-team { gap: .5rem; padding: .3rem .9rem; }
        .pv-work { gap: 1.25rem; }
        .pv-board { gap: .9rem; padding-bottom: .5rem; }
        .pv-col-head { gap: .5rem; padding: .75rem 1rem; }
        .pv-col.collapsed { gap: .6rem; padding: .75rem 0; }
        .pv-col-body { gap: .6rem; padding: .75rem; }
        .pv-doctor { margin: .6rem .25rem .1rem; }
        .pv-col-body > .pv-doctor:first-child { margin-top: .1rem; }
        .badge { line-height: 1.45; padding: .2rem .65rem; }
        .pv-badges { gap: .4rem; }
        .pv-go { padding: .3rem .7rem; }
        .pv-panel-head { gap: .75rem; padding: 1rem 1.25rem; }
        .pv-panel-head > div { display: grid; gap: .35rem; justify-items: start; }
        .pv-panel-body { gap: 1.25rem; padding: 1.25rem; }
        .pv-field { gap: .5rem; }
        .pv-row { gap: .5rem; }
        .pv-row input, .pv-row select { padding: .45rem .75rem; }
        /* A list takes its own line, so its choice is never cut; its button goes under it. */
        .pv-row > select { flex-basis: 100%; }
        .pv-q { padding: .7rem .9rem; }
        .pv-q ol { margin-top: .4rem; padding-left: 1.4rem; }

        /* Measured at 1920px: a column's card line has about 230px for position, HN, wait and button. */
        .vA .pv-col-body { gap: .65rem; padding: .6rem; }
        .vA .pv-card { gap: .55rem; padding: .7rem; }
        .vA .pv-card-line { gap: .5rem; }
        .vA .pv-pos { min-width: 1.1rem; width: auto; }
        .vA .pv-go { flex: none; justify-content: center; padding: 0; width: 2.4rem; }
        .vA .pv-attn { gap: .5rem .6rem; margin-top: .25rem; }
        .vA .pv-attn-chip { gap: .45rem; padding: .35rem .5rem .35rem .9rem; }
        .vA .pv-attn-chip:not(:has(.x)) { padding-right: .9rem; }

        /* The HN column takes its own width, and a column is never narrower than its row: the board scrolls instead. */
        /* Row: 1.3 + 5.2 + .8 + 2.8 + 2.4 rem of cells, 4 gaps of .45rem, .6rem padding each side, 2px of border. */
        .vB .pv-board { --col-min: 15.6rem; }
        .vB .pv-line { gap: .45rem; grid-template-columns: 1.3rem 5.2rem minmax(.8rem, 1fr) 2.8rem 2.4rem; padding: .5rem .6rem; }
        .vB .pv-line .pv-wait { text-align: right; }
        /* Rows touch, so a flag or a selection is drawn inside the row, not around it. */
        .vB .pv-flag { box-shadow: inset 5px 0 0 var(--danger); outline: none; }
        .vB .pv-selected { box-shadow: inset 0 0 0 3px var(--accent) !important; }
        .vB .pv-dots { gap: .3rem; justify-content: flex-end; }
        .vB .pv-go { padding: .3rem 0; width: 2.4rem; }
        .vB .pv-doctor { margin: 0; padding: .4rem .75rem; }
        .vB .pv-attn { margin-top: .25rem; }
        .vB .pv-attn summary { padding: .7rem 1rem; }
        .vB .pv-attn ul { gap: 0 2rem; padding: 0 1rem .6rem; }
        .vB .pv-attn li { gap: .6rem; padding: .45rem 0; }
        .vB .pv-legend { gap: .35rem 1.1rem; margin: .6rem 0 0; }
        .vB .pv-legend span { gap: .35rem; }

        /* The position sits on its own row, so it no longer overlaps the HN and two tiles still fit side by side. */
        /* A column's body is about 255px at 1920px: two tiles of 6.6rem and a gap fit; a 9-digit HN needs about 90px. */
        .vC .pv-col-body { padding: .6rem; }
        .vC .pv-tiles { gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(6.6rem, 1fr)); }
        .vC .pv-tile { gap: .25rem; min-height: 0; padding: .55rem .6rem; }
        .vC .pv-tile .pv-pos { justify-self: end; line-height: 1; position: static; }
        .vC .pv-tile .pv-hn { justify-self: start; text-align: left; }
        .vC .pv-corner { flex-wrap: wrap; gap: .3rem; min-height: 1.6rem; padding-right: 2.2rem; }
        .vC .pv-corner i { line-height: 1.3; padding: .1rem .35rem; }
        .vC .pv-tile .pv-go { bottom: .45rem; padding: .25rem .55rem; right: .45rem; }
        .vC .pv-banner { gap: 1.25rem; margin-top: .25rem; padding: .8rem 1.25rem; }
        .vC .pv-banner-list { gap: .5rem; margin-top: .5rem; padding: .7rem 1rem; }
        .vC .pv-banner-list div { gap: .6rem; }
        .vC .pv-tabs button { padding: .6rem .5rem; }

        /* D borrows A's and C's classes; its panel is A's overlay, so C's docked panel rules are undone here. */
        .vD .pv-panel { border-radius: var(--radius) 0 0 var(--radius); bottom: 0; max-height: none; position: fixed; right: 0; top: 0; width: 26rem; z-index: 40; }

        /* ---------- D polish: calmer surfaces, one accent, status as thin bars instead of boxes ---------- */
        .vD { --bg: #f2f4f7; --line: #e1e6ed; --radius-sm: 10px; --radius: 14px; }
        .vD .topbar { background: var(--surface); box-shadow: 0 1px 2px rgb(13 23 34 / 4%); }
        .vD .brand h1 { letter-spacing: -.005em; }
        .vD .segmented { border-radius: 12px; padding: 4px; }
        .vD .segmented button { border-radius: 9px; }

        /* Figures read as one strip, split by hairlines. */
        .vD .pv-figures { gap: 0; }
        .vD .pv-figure { border-left: 1px solid var(--line); padding: 0 1rem; }
        .vD .pv-figure:first-child { border-left: 0; padding-left: 0; }
        .vD .pv-figure b { font-size: 1.1rem; font-weight: 700; }
        .vD .pv-chip, .vD .live { border-color: var(--line); box-shadow: var(--shadow-sm); }

        /* Attention: a white card with a red edge and a count chip, not a red slab. */
        .vD .pv-banner { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--danger); box-shadow: var(--shadow-sm); color: var(--text); padding: .7rem 1rem .7rem 1.1rem; }
        .vD .pv-banner.calm { background: var(--surface); border-left-color: var(--ok); color: var(--ok); }
        .vD .pv-banner .big { background: var(--danger-soft); border-radius: 10px; color: var(--danger); font-size: 1.5rem; min-width: 3rem; padding: .3rem .7rem; text-align: center; }
        .vD .pv-banner .first { color: var(--text); font-weight: 500; }
        .vD .pv-banner button { background: var(--surface); border: 1px solid var(--line-strong); color: var(--text); }
        .vD .pv-banner button:hover { background: var(--surface-2); }
        .vD .pv-banner-list { border: 1px solid var(--line); box-shadow: var(--shadow-sm); gap: 0; padding: .3rem 1rem; }
        .vD .pv-banner-list > div { border-top: 1px solid var(--line); border-radius: 6px; padding: .55rem .4rem; }
        .vD .pv-banner-list > div:first-child { border-top: 0; }
        .vD .pv-banner-list > div:hover { background: var(--surface-2); }
        .vD .pv-banner-list > div[data-sev='high'] > .i { color: var(--danger); }
        .vD .pv-banner-list > div[data-sev='mid'] > .i { color: var(--warn); }

        .vD .pv-team { border-color: var(--line); box-shadow: var(--shadow-sm); }

        /* Columns are lanes: a tinted ground with no frame; the cards on them are the white surfaces. */
        .vD .pv-board { gap: .75rem; }
        .vD .pv-col { background: #e8ecf1; border: 0; border-radius: var(--radius); }
        .vD .pv-col-head { border-bottom: 0; font-weight: 600; padding: .85rem 1rem .35rem; }
        .vD .pv-col-head .count { background: var(--surface); color: var(--muted); }
        .vD .pv-col.collapsed { background: transparent; border: 1.5px dashed var(--line-strong); }
        .vD .pv-doctor { align-items: center; color: var(--muted); font-weight: 600; }
        .vD .pv-doctor::after { background: var(--line-strong); content: ''; flex: 1; height: 1px; opacity: .6; }
        .vD .pv-doctor.none { color: var(--warn); }

        /* Cards: no frame, a soft shadow, and a 4px bar on the left for wait and trouble. */
        .vD .pv-card { border: 0; box-shadow: 0 1px 2px rgb(13 23 34 / 7%), 0 2px 6px -2px rgb(13 23 34 / 6%); overflow: hidden; position: relative; transition: box-shadow .15s; }
        .vD .pv-card:hover { box-shadow: 0 2px 4px rgb(13 23 34 / 8%), 0 8px 20px -8px rgb(13 23 34 / 22%); }
        .vD [data-tier].pv-card { border-left: 0; }
        .vD .pv-card::before { background: transparent; bottom: 0; content: ''; left: 0; position: absolute; top: 0; width: 4px; }
        .vD [data-tier='warn'].pv-card::before { background: var(--warn); }
        .vD [data-tier='long'].pv-card::before, .vD .pv-flag.pv-card::before { background: var(--danger); }
        .vD .pv-flag { outline: none; }
        .vD .pv-selected { box-shadow: 0 0 0 2px var(--accent), 0 8px 20px -8px rgb(11 79 179 / 35%) !important; }
        .vD .pv-hn-link { font-weight: 600; text-decoration: none; }
        .vD .pv-hn-link:hover { color: var(--accent); text-decoration: underline; }
        .vD .pv-pos { color: var(--faint); font-weight: 500; }
        .vD .badge { border-radius: 6px; font-weight: 600; }
        /* The per-card action is tinted, not solid: seventeen solid blue squares were the loudest thing on the page. */
        .vD .pv-card .pv-go { background: var(--accent-soft); border: 0; color: var(--accent); }
        .vD .pv-card .pv-go:hover { background: var(--accent); color: var(--on-accent); }

        /* Panel: a sheet with a soft edge shadow; head on a tinted band; sections split by hairlines. */
        .vD .pv-panel { border: 0; border-radius: 0; box-shadow: -16px 0 48px -16px rgb(13 23 34 / 35%); }
        .vD .pv-panel-head { background: var(--surface-2); }
        .vD .pv-panel-head .pv-hn { font-size: 1.35rem; }
        .vD .pv-panel-body > .pv-panel-body + .pv-panel-body { border-top: 1px solid var(--line); padding-top: 1.25rem !important; }
        .vD .pv-field > span { color: var(--muted); font-weight: 600; }
        .vD .pv-scrim { background: rgb(13 23 34 / 24%); }

        /* ---------- D's panel: facts, stepper, chips, status lists, pinned action ---------- */
        .vD .pv-panel.pd { display: flex; flex-direction: column; width: 28rem; }
        .pd-head { background: var(--surface); border-bottom: 1px solid var(--line); display: grid; gap: 1rem; padding: 1.25rem 1.5rem 1.1rem; }
        .pd-top { align-items: flex-start; display: flex; justify-content: space-between; }
        .pd-title { display: grid; gap: .1rem; justify-items: start; }
        .pd-eyebrow { color: var(--muted); font-size: .85rem; font-weight: 600; }
        .vD .pd-title .pv-hn-link { font-size: 1.6rem; font-weight: 700; letter-spacing: .01em; line-height: 1.3; }
        .pd-close { border-radius: 10px; justify-content: center; padding: 0; width: 2.4rem; }
        .pd-facts { display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; margin: 0; }
        .pd-fact { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .8rem; }
        .pd-fact dt { color: var(--muted); font-size: .85rem; font-weight: 600; }
        .pd-fact dd { font-size: 1rem; font-weight: 600; margin: 0; }
        .pd-fact .pv-wait { color: var(--text); font-size: 1rem; }
        .pd-fact[data-nhso='not_yet'] dd { color: var(--warn); }
        .pd-fact[data-nhso='unavailable'] dd { color: var(--danger); }
        .pd-fact[data-nhso='authenticated'] dd, .pd-fact[data-nhso='bypassed'] dd { color: var(--ok); }

        .pd-body { flex: 1; overflow-y: auto; padding: .25rem 1.5rem 1.25rem; }
        .pd-section { border-top: 1px solid var(--line); padding: 1.1rem 0; }
        .pd-section:first-child { border-top: 0; }
        .pd-h { align-items: center; display: flex; font-size: 1rem; font-weight: 700; gap: .55rem; margin-bottom: .7rem; }
        .pd-h .i { color: var(--accent); }
        .pd-hint { color: var(--muted); font-size: .88rem; margin: -.35rem 0 .6rem; }

        /* The pathway as a vertical stepper: past stages ticked, the current one filled, the picked one outlined. */
        .pd-steps { display: grid; gap: 2px; list-style: none; margin: 0; padding: 0; }
        .pd-step { align-items: center; border-radius: 10px; cursor: pointer; display: flex; gap: .75rem; padding: .4rem .6rem; position: relative; }
        .pd-step:hover { background: var(--surface-2); }
        .pd-step:focus-visible { box-shadow: var(--ring); outline: 0; }
        .pd-step[data-state='current'] { background: var(--accent-soft); cursor: default; }
        .pd-step.target { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }
        .pd-step:not(:last-child)::after { background: var(--line-strong); content: ''; height: calc(100% - 1.75rem + 2px); left: calc(.6rem + .875rem - 1px); position: absolute; top: calc(50% + .875rem); width: 2px; }
        .pd-step[data-state='past']::after { background: var(--ok); }
        .pd-mark { align-items: center; background: var(--surface); border: 2px solid var(--line-strong); border-radius: 50%; color: var(--muted); display: flex; flex: none; font-size: .85rem; font-weight: 700; height: 1.75rem; justify-content: center; position: relative; width: 1.75rem; z-index: 1; }
        .pd-mark .i { height: .95rem; width: .95rem; stroke-width: 3; }
        .pd-step[data-state='past'] .pd-mark { background: var(--ok); border-color: var(--ok); color: #fff; }
        .pd-step[data-state='current'] .pd-mark { background: var(--accent); border-color: var(--accent); color: #fff; }
        .pd-step.target .pd-mark { border-color: var(--accent); color: var(--accent); }
        .pd-step-name { flex: 1; font-weight: 500; }
        .pd-step[data-state='past'] .pd-step-name { color: var(--muted); }
        .pd-step[data-state='current'] .pd-step-name, .pd-step.target .pd-step-name { font-weight: 700; }
        .pd-tag { background: var(--accent-soft); border-radius: 6px; color: var(--accent); flex: none; font-size: .85rem; font-weight: 600; padding: .1rem .55rem; }
        .pd-step[data-state='current'] .pd-tag { background: var(--surface); }
        .pd-tag.target { background: var(--accent); color: var(--on-accent); }
        .pd-tag.ok { background: var(--ok-soft); color: var(--ok); }
        .pd-tag.warn { background: var(--warn-soft); color: var(--warn); }

        .pd-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
        .pd-chip { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: .2rem 1rem; }
        .pd-chip[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .pd-other { display: flex; gap: .5rem; margin-top: .65rem; }
        .pd-other input { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text); flex: 1; min-width: 0; padding: .45rem .75rem; }

        .pd-list { border: 1px solid var(--line); border-radius: 12px; display: grid; overflow: hidden; }
        .pd-item { align-items: center; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .6rem; padding: .6rem .6rem .6rem .9rem; }
        .pd-item:first-child { border-top: 0; }
        .pd-item.playing { background: var(--accent-soft); }
        .pd-item-name { flex: 1; font-weight: 500; min-width: 0; }
        .pd-small { border-radius: 9px; min-height: 2.3rem; padding: .15rem .85rem; }
        .pd-small .i { height: 1rem; width: 1rem; }
        .pd-answers { color: var(--muted); flex-basis: 100%; margin: 0; padding-left: 1.3rem; }

        .pd-foot { background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -10px 24px -14px rgb(13 23 34 / 22%); display: flex; gap: .6rem; padding: 1rem 1.5rem; }
        .pd-go { border-radius: 12px; flex: 1; font-size: 1.05rem; justify-content: center; min-height: 3rem; }
        .pd-done { border-radius: 12px; min-height: 3rem; padding: 0 1.1rem; }

        /* ---------- D's icons and infographics ---------- */
        /* Wait tiers: validated as a set (light, CVD-safe); text never wears them, only marks and icons do. */
        .vD { --tier-ok: #0b6a3a; --tier-warn: #c77700; --tier-long: #b01e17; }
        .pv-fig-ic, .pv-avail, .pv-waitbox { align-items: center; display: inline-flex; }

        /* Header figures as stat tiles: an icon on a tinted tile, the value over its label. */
        .vD .pv-figure { column-gap: .6rem; display: grid; grid-template-columns: auto auto; line-height: 1.15; padding: 0 1.1rem; }
        .vD .pv-fig-ic { background: var(--accent-soft); border-radius: 10px; color: var(--accent); grid-row: span 2; height: 2.3rem; justify-content: center; width: 2.3rem; }
        .vD .pv-fig-ic .i { height: 1.15rem; width: 1.15rem; }
        .vD .pv-figure b { font-size: 1.25rem; grid-column: 2; grid-row: 1; }
        .vD .pv-fig-label { color: var(--muted); font-size: .8rem; font-weight: 500; grid-column: 2; grid-row: 2; }

        /* Team strip: who is free, as dots beside the counts. */
        .vD .pv-teams-label { align-items: center; display: inline-flex; gap: .4rem; }
        .vD .pv-teams-label .i { color: var(--muted); height: 1.1rem; width: 1.1rem; }
        .pv-avail { display: none; }
        .vD .pv-avail { display: inline-flex; gap: 3px; }
        .vD .pv-avail i { border-radius: 50%; height: .6rem; width: .6rem; }
        .vD .pv-avail i.free { background: var(--tier-ok); }
        .vD .pv-avail i.busy { box-shadow: inset 0 0 0 2px var(--line-strong); }

        /* Board legend, on the team strip's row, so the bars need no words of their own. */
        .pv-tier-legend { align-items: center; color: var(--muted); display: flex; flex-wrap: wrap; font-size: .88rem; gap: .35rem 1.1rem; margin-left: auto; }
        .pv-tier-legend-title { font-weight: 600; }
        .pv-tier-key { align-items: center; display: inline-flex; gap: .35rem; }
        .pv-tier-key b { color: var(--text); font-variant-numeric: tabular-nums; }
        .pv-tier-key .swatch { border-radius: 999px; height: 8px; width: 1.4rem; }
        .pv-tier-key .i { height: 1rem; width: 1rem; }
        .pv-tier-key.ok .swatch { background: var(--tier-ok); }
        .pv-tier-key.warn .swatch { background: var(--tier-warn); }
        .pv-tier-key.long .swatch { background: var(--tier-long); }
        .pv-tier-key.ok .i { color: var(--tier-ok); }
        .pv-tier-key.warn .i { color: var(--tier-warn); }
        .pv-tier-key.long .i { color: var(--tier-long); }

        /* Under each column's title: a thin segmented bar of its wait tiers, then two short facts. */
        .pv-col-stats { display: grid; gap: .4rem; padding: .15rem 1rem .5rem; }
        .pv-tierbar { background: var(--surface); border-radius: 999px; display: flex; gap: 2px; height: 8px; overflow: hidden; }
        .pv-tierbar .seg { flex-basis: 0; min-width: 8px; }
        .pv-tierbar .seg.ok { background: var(--tier-ok); }
        .pv-tierbar .seg.warn { background: var(--tier-warn); }
        .pv-tierbar .seg.long { background: var(--tier-long); }
        .pv-col-line { align-items: center; color: var(--muted); display: flex; flex-wrap: wrap; font-size: .82rem; gap: .2rem .8rem; }
        .pv-col-fact { align-items: center; display: inline-flex; gap: .3rem; white-space: nowrap; }
        .pv-col-fact .i { height: .9rem; width: .9rem; }
        .pv-col-fact[data-tier='warn'] .i { color: var(--tier-warn); }
        .pv-col-fact[data-tier='long'] .i, .pv-col-fact.over .i { color: var(--tier-long); }
        .pv-col-fact.over { color: var(--text); font-weight: 600; }

        /* Cards: the wait wears a clock; badges wear their meaning's icon. */
        /* The clock costs about 18px of a card line measured at 240px: give it back from the gaps and the padding. */
        .vD .pv-card { padding-left: .6rem; padding-right: .6rem; }
        .vD .pv-card-line { gap: .3rem; }
        .vD .pv-waitbox { gap: .2rem; }
        .vD .pv-waitbox .i { color: var(--faint); height: .9rem; width: .9rem; }
        .vD [data-tier='warn'] .pv-waitbox .i { color: var(--tier-warn); }
        .vD [data-tier='long'] .pv-waitbox .i { color: var(--tier-long); }
        .vD .badge { align-items: center; display: inline-flex; gap: .3rem; }
        .vD .badge .i { flex: none; height: .85rem; width: .85rem; }
        .vD .badge.next { background: var(--ok-soft); color: var(--ok); }
        .vD .badge.at { background: var(--surface-3); color: var(--text); }

        /* Panel facts wear icons; the wait is a meter across the top. */
        .pd-fact dt { align-items: center; display: flex; gap: .35rem; }
        .pd-fact dt .i { color: var(--faint); height: .95rem; width: .95rem; }
        /* With the wait in the meter, the other facts read as one-line key and value rows: the head stays short. */
        .vD .pd-facts { column-gap: 1.25rem; grid-template-columns: 1fr 1fr; row-gap: 0; }
        .vD .pd-meter { grid-column: span 2; margin-bottom: .4rem; }
        .vD .pd-fact { background: none; border: 0; border-radius: 0; border-top: 1px solid var(--line); display: grid; gap: .05rem; padding: .4rem .15rem; }
        .vD .pd-fact:nth-child(2), .vD .pd-fact:nth-child(3) { border-top: 0; }
        .vD .pd-fact:last-child:nth-child(even) { grid-column: span 2; }
        .pd-meter { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; display: grid; gap: .35rem; padding: .6rem .8rem .65rem; }
        .pd-meter-top { align-items: baseline; display: flex; justify-content: space-between; }
        .pd-meter-label { align-items: center; color: var(--muted); display: inline-flex; font-size: .85rem; font-weight: 600; gap: .35rem; }
        .pd-meter-label .i { color: var(--faint); height: .95rem; width: .95rem; }
        .pd-meter-value .pv-wait { color: var(--text); font-size: 1.3rem; font-weight: 700; }
        .pd-meter-of { color: var(--muted); font-size: .85rem; }
        .pd-track { background: var(--ok-soft); border-radius: 999px; height: 10px; overflow: hidden; position: relative; }
        .pd-fill { background: var(--tier-ok); border-radius: 999px; display: block; height: 100%; transition: width .4s; }
        .pd-tick { background: var(--surface); height: 100%; left: calc(100% / 3); position: absolute; top: 0; width: 2px; }
        .pd-meter[data-tier='warn'] .pd-track { background: var(--warn-soft); }
        .pd-meter[data-tier='warn'] .pd-fill { background: var(--tier-warn); }
        .pd-meter[data-tier='long'] .pd-track { background: var(--danger-soft); }
        .pd-meter[data-tier='long'] .pd-fill { background: var(--tier-long); }
        .pd-scale { color: var(--faint); display: flex; font-size: .75rem; justify-content: space-between; position: relative; }
        .pd-scale .five { left: calc(100% / 3); position: absolute; transform: translateX(-50%); }
        .pd-meter-cap { align-items: center; display: flex; font-size: .88rem; font-weight: 600; gap: .4rem; }
        .pd-meter-cap .i { color: var(--tier-ok); height: 1rem; width: 1rem; }

        /* ---------- D: what the API already sends but the screen did not show ---------- */
        .vD .badge.unrec { background: var(--danger); color: var(--on-accent); }
        .vD .badge.absent { background: var(--warn-soft); color: var(--warn); }
        .vD .badge.qwait { background: var(--surface-3); color: var(--text); }
        .vD .badge.qdone { background: var(--ok-soft); color: var(--ok); }
        .vD .pv-absent { background: var(--surface-2); }
        .vD .pv-absent .pv-hn-link { color: var(--muted); }

        /* Staff against the queue, in the column head. */
        .pv-col-fact.staff .i { color: var(--faint); }
        .pv-col-fact.staff[data-mood='idle'] { color: var(--text); font-weight: 600; }
        .pv-col-fact.staff[data-mood='idle'] .i { color: var(--tier-ok); }
        .pv-col-fact.staff[data-mood='none'] { color: var(--text); font-weight: 600; }
        .pv-col-fact.staff[data-mood='none'] .i { color: var(--tier-warn); }

        /* Moves: a stuck one shows on the figure itself. */
        .vD .pv-figure[title] { cursor: pointer; }
        .pv-fig-warn { align-items: center; background: var(--warn-soft); border-radius: 6px; color: var(--warn); display: inline-flex; font-size: .78rem; font-weight: 700; gap: .2rem; grid-column: 3; grid-row: 1 / span 2; margin-left: .2rem; padding: .1rem .4rem; }
        .pv-fig-warn .i { height: .8rem; width: .8rem; }
        .vD .pv-figure[data-stuck] { grid-template-columns: auto auto auto; }
        .vD .pv-figure[data-stuck] .pv-fig-ic { background: var(--warn-soft); color: var(--warn); }

        /* Patients in their room that no queue holds. */
        .pv-unq { align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--warn); border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; gap: .6rem 1rem; margin-bottom: 1rem; padding: .7rem 1rem; }
        .pv-unq-head { align-items: center; display: inline-flex; font-weight: 600; gap: .45rem; }
        .pv-unq-head .i { color: var(--warn); height: 1.1rem; width: 1.1rem; }
        .pv-unq-head .count { background: var(--warn-soft); color: var(--warn); }
        .pv-unq-list { display: flex; flex-wrap: wrap; gap: .6rem; }
        .pv-unq-card { align-items: center; background: var(--surface-2); border-radius: 10px; display: inline-flex; gap: .6rem; padding: .35rem .4rem .35rem .8rem; }
        .pv-unq-hn { font-weight: 600; }
        .vD .badge.appt-none { background: var(--surface-3); color: var(--text); }
        .vD .badge.appt-all_seen { background: var(--ok-soft); color: var(--ok); }
        .vD .badge.appt-unreadable { background: var(--warn-soft); color: var(--warn); }
        .pv-unq-go { border-radius: 9px; min-height: 2.2rem; padding: .15rem .8rem; }
        .pv-unq-go .i { height: 1rem; width: 1rem; }

        /* Panel: what makes this patient's room unusable, before the facts. */
        .pd-alerts { display: grid; gap: .4rem; }
        .pd-alert { align-items: flex-start; border-radius: 10px; display: flex; font-size: .92rem; font-weight: 600; gap: .5rem; padding: .5rem .75rem; }
        .pd-alert .i { flex: none; height: 1.1rem; margin-top: .15rem; width: 1.1rem; }
        .pd-alert.high { background: var(--danger-soft); color: var(--danger); }
        .pd-alert.mid { background: var(--warn-soft); color: var(--warn); }

        /* ---------- D +backend: data the backend keeps but does not send to the screen yet ---------- */
        /* Two series, validated as a pair (light); the lighter one fails 3:1, so every bar carries its value. */
        .vD { --series-in: #2a78d6; --series-out: #e87ba4; }
        .vD .pv-figure.done .pv-fig-ic { background: var(--ok-soft); color: var(--ok); }

        .pv-boardbar { align-items: center; display: flex; gap: .75rem; margin-bottom: 1rem; }
        .pv-boardbar-label { color: var(--muted); font-size: .88rem; font-weight: 600; }
        .pv-clinics { border-radius: 12px; padding: 4px; }
        .pv-clinics button { align-items: center; border-radius: 9px; display: inline-flex; gap: .45rem; }
        .pv-clinics .count { background: var(--surface-3); }
        .pv-stats-btn { border-radius: 10px; margin-left: auto; }
        .pv-stats-btn[aria-expanded='true'] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

        .vD .badge.clinic { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted); }
        .vD .badge.appt { background: var(--surface-3); color: var(--text); }
        .vD .badge.late { background: var(--warn-soft); color: var(--warn); }
        .vD .badge.total { background: var(--surface-3); color: var(--text); }
        .pd-fact[data-late] dd { color: var(--warn); }

        .pd-dur { align-items: center; color: var(--muted); display: inline-flex; flex: none; font-size: .82rem; gap: .4rem; }
        .pd-dur-bar { border-radius: 999px; display: block; height: 6px; min-width: 4px; }
        .pd-dur.ok .pd-dur-bar { background: var(--tier-ok); }
        .pd-dur.warn .pd-dur-bar { background: var(--tier-warn); }
        .pd-dur.long .pd-dur-bar { background: var(--tier-long); }

        .pv-today { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); display: grid; gap: 1.5rem; grid-template-columns: 17rem minmax(0, 1.3fr) minmax(0, 1fr); margin-bottom: 1rem; padding: 1.1rem 1.25rem; }
        .pv-today-tiles { display: grid; gap: .6rem; }
        .pv-today-tile { column-gap: .7rem; display: grid; grid-template-columns: auto 1fr; line-height: 1.2; }
        .pv-today-tile .pv-fig-ic { align-items: center; background: var(--accent-soft); border-radius: 10px; color: var(--accent); display: inline-flex; grid-row: span 3; height: 2.4rem; justify-content: center; width: 2.4rem; }
        .pv-today-tile b { font-size: 1.3rem; }
        .pv-today-tile .label { color: var(--text); font-size: .88rem; font-weight: 600; }
        .pv-today-tile .note { color: var(--muted); font-size: .8rem; }
        .pv-chart h3 { font-size: .95rem; margin: 0 0 .6rem; }
        .pv-chart-note { color: var(--muted); font-size: .8rem; margin: .4rem 0 0; }
        .pv-hbars { display: grid; gap: .35rem; }
        .pv-hbar { align-items: center; display: grid; font-size: .85rem; gap: .6rem; grid-template-columns: 10.5rem 1fr 2.2rem; }
        .pv-hbar .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pv-hbar .val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
        .pv-hbar .track { display: block; height: 10px; position: relative; }
        .pv-hbar .fill { border-radius: 0 4px 4px 0; display: block; height: 100%; }
        .pv-hbar .fill.ok { background: var(--tier-ok); }
        .pv-hbar .fill.warn { background: var(--tier-warn); }
        .pv-hbar .fill.long { background: var(--tier-long); }
        .pv-hbar .limit { border-left: 2px dashed var(--line-strong); bottom: -4px; position: absolute; top: -4px; }
        .pv-chart-legend { color: var(--muted); display: flex; font-size: .85rem; gap: 1rem; margin-bottom: .4rem; }
        .pv-chart-legend span { align-items: center; display: inline-flex; gap: .35rem; }
        .pv-chart-legend .key { border-radius: 3px; height: .7rem; width: .7rem; }
        .pv-chart-legend .key.in, .pv-cols .bar.in { background: var(--series-in); }
        .pv-chart-legend .key.out, .pv-cols .bar.out { background: var(--series-out); }
        .pv-cols { align-items: end; border-bottom: 1px solid var(--line-strong); display: grid; gap: 1rem; grid-template-columns: repeat(4, 1fr); height: 8.5rem; padding-top: 1.2rem; }
        .pv-col-group { display: grid; height: 100%; grid-template-rows: 1fr auto; position: relative; }
        .pv-col-group .bars { align-items: end; display: flex; gap: 2px; justify-content: center; }
        .pv-cols .bar { border-radius: 4px 4px 0 0; display: block; position: relative; width: 1.4rem; }
        .pv-cols .bar .v { color: var(--text); font-size: .78rem; font-variant-numeric: tabular-nums; font-weight: 600; left: 50%; position: absolute; top: -1.15rem; transform: translateX(-50%); }
        .pv-col-group .hour { bottom: -1.4rem; color: var(--muted); font-size: .78rem; left: 0; position: absolute; right: 0; text-align: center; white-space: nowrap; }
        .pv-today .pv-chart:last-child { padding-bottom: 1.4rem; }
        .pd-meter[data-tier='warn'] .pd-meter-cap .i { color: var(--tier-warn); }
        .pd-meter[data-tier='long'] .pd-meter-cap .i { color: var(--tier-long); }
    </style>
</head>
<body>
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-logo" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="currentColor" stroke="none"/><path d="M12 6.5v11M6.5 12h11" stroke="#fff" stroke-width="2.6"/></symbol>

        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></symbol>

        <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 2.5h12M6 21.5h12M7 2.5c0 5 10 6 10 9.5S7 16.5 7 21.5M17 2.5c0 5-10 6-10 9.5s10 4.5 10 9.5"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
