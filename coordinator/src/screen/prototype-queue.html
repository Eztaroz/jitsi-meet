    <header class="topbar">
        <div class="brand">
            <svg class="brand-mark" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg>
            <div>
                <h1>หน้าจอผู้ประสานงาน</h1>
                <p class="tagline">คิว ห้อง และเจ้าหน้าที่ ในหน้าเดียว</p>
            </div>
            <div id="views" class="segmented pv-views" role="group" aria-label="มุมมอง">
                <button type="button" data-view="queue" aria-pressed="true">คิว</button>
                <button type="button" data-view="rooms" aria-pressed="false">ห้องและการย้าย</button>
            </div>
        </div>
        <div class="pv-head-right">
            <div id="figures" class="pv-figures"></div>
            <span id="nhso-chip" class="pv-chip" role="button" tabindex="0"></span>
            <span class="live" data-state="ok"><i class="live-dot"></i>อัปเดตสด</span>
            <span class="user"><span class="avatar">ส</span><span>สุดา</span></span>
            <button type="button" class="ghost icon-button" title="ออกจากระบบ"><svg class="i"><use href="#i-logout"/></svg></button>
        </div>
    </header>

    <main class="pv-main">
        <div id="attention"></div>
        <div id="content"></div>
    </main>

    <div class="pv-switch" id="switch"></div>

    <script>
    'use strict';

    // ---------- Fake data ----------
    const STAGES = [
        [ 'waiting', 'รอคิว', 'clock' ],
        [ 'registration', 'ลงทะเบียน', 'clipboard' ],
        [ 'intake', 'ให้ข้อมูลก่อนพบแพทย์', 'clipboard' ],
        [ 'examination', 'พบแพทย์', 'stethoscope' ],
        [ 'aftercare', 'หลังพบแพทย์', 'heart' ],
        [ 'billing', 'ชำระเงิน', 'clipboard' ],
        [ 'pharmacy', 'รับยา', 'clipboard' ]
    ];
    const STAGE_NAME = Object.fromEntries(STAGES.map(s => [ s[0], s[1] ]));
    const WAIT_WARN = 5 * 60;
    const WAIT_LONG = 15 * 60;
    const NHSO = {
        authenticated: 'สปสช. ยืนยันแล้ว',
        bypassed: 'สปสช. bypass',
        not_yet: 'สปสช. ยังไม่ยืนยัน',
        unavailable: 'สปสช. ตรวจไม่ได้'
    };
    const VIDEOS = [ { id: 'v1', title: 'การเตรียมตัวก่อนพบแพทย์' }, { id: 'v2', title: 'การใช้ยาอย่างถูกวิธี' } ];
    const QUESTIONNAIRES = [ { id: 'q1', title: 'อาการทั่วไปวันนี้' }, { id: 'q2', title: 'ความเสี่ยงการหกล้ม' } ];
    const DOCTORS = [ 'D1024', 'D2087' ];

    let seq = 0;

    // The prototype's clock: it is 10:50 when the page opens.
    const NOW = 10 * 60 + 50;
    const CLINICS = { med: 'อายุรกรรม', gyn: 'นรีเวช' };

    function encounter(stage, waited, extra = {}) {
        seq++;

        // What the backend already keeps for each encounter: its clinic, its history (each stage done, and for how long),
        // and, for one started from an appointment, that appointment's time in the HIS.
        const cur = STAGES.findIndex(st => st[0] === stage);
        const history = {};

        for (let i = 0; i < cur; i++) history[STAGES[i][0]] = ((seq * 7 + i * 13) % 19 + 3) * 60;

        const appt = seq % 3 === 0 ? undefined : NOW - ((seq * 23) % 90) + 10;

        return { id: `e${seq}`, hn: String(650010000 + seq * 37), stage, waited, nhso: 'authenticated',
            questionnaires: [], clinic: seq % 3 === 1 ? 'gyn' : 'med', history, appt, ...extra };
    }

    function normalLoad() {
        seq = 0;

        return [
            encounter('waiting', 1140, { nhso: 'not_yet' }),
            encounter('waiting', 610, { suggested: true }),
            encounter('waiting', 420),
            encounter('waiting', 95, { nhso: 'not_yet', absent: true }),
            encounter('waiting', 30),
            encounter('registration', 260, { at: [ 'สถานี 1' ] }),
            encounter('registration', 75),
            encounter('intake', 980, { nhso: 'unavailable' }),
            encounter('intake', 330, { at: [ 'สถานี 2' ], questionnaires: [ { id: 'q1', answers: [ 'ไม่มีไข้', 'ไม่ไอ' ] } ] }),
            encounter('intake', 40, { questionnaires: [ { id: 'q2' } ] }),
            encounter('examination', 700, { doctor: 'D1024', at: [ 'ห้องตรวจ 3' ], video: 'v1', unrecorded: true }),
            encounter('examination', 410, { doctor: 'D1024' }),
            encounter('examination', 1300, { doctor: 'D2087', playing: true, video: 'v1' }),
            encounter('examination', 520),
            encounter('examination', 150),
            encounter('billing', 200, { absent: true }),
            encounter('pharmacy', 380, { nhso: 'not_yet' })
        ];
    }

    function heavyLoad() {
        const out = normalLoad();
        const stages = [ 'waiting', 'waiting', 'waiting', 'registration', 'intake', 'examination', 'examination', 'billing', 'pharmacy' ];

        for (let i = 0; i < 30; i++) {
            const stage = stages[i % stages.length];
            const extra = {};

            if (i % 7 === 0) extra.nhso = 'not_yet';
            if (i % 11 === 0) extra.nhso = 'unavailable';
            if (stage === 'examination' && i % 3) extra.doctor = DOCTORS[i % 2];
            if (i % 5 === 0) extra.at = [ `สถานี ${1 + (i % 3)}` ];
            if (i % 13 === 4) extra.absent = true;
            if (i === 10) extra.unrecorded = true;
            if (i % 6 === 2) extra.questionnaires = [ { id: 'q1' } ];
            if (i % 6 === 3) extra.questionnaires = [ { id: 'q2', answers: [ 'ไม่เคยหกล้ม', 'เดินเองได้' ] } ];
            out.push(encounter(stage, (i * 97) % 1500, extra));
        }

        return out;
    }

    const TEAMS = [
        { id: 'สถานี 1', stageIds: [ 'registration' ], stages: 'ลงทะเบียน', free: [ 'นภา' ], busy: [ [ 'สมศรี', '650010222' ] ] },
        { id: 'สถานี 2', stageIds: [ 'intake' ], stages: 'ให้ข้อมูลก่อนพบแพทย์', free: [], busy: [ [ 'วิไล', '650010333' ] ] },
        { id: 'ห้องตรวจ 3', stageIds: [ 'examination', 'aftercare' ], stages: 'พบแพทย์, หลังพบแพทย์', free: [ 'พญ.กมล', 'ปรีชา' ], busy: [ [ 'นพ.อนันต์', '650010407' ] ] },
        { id: 'การเงิน', stageIds: [ 'billing', 'pharmacy' ], stages: 'ชำระเงิน, รับยา', free: [ 'จิราพร' ], busy: [] }
    ];

    const state = {
        variant: 'A',
        base: 18,
        view: 'queue',
        load: 'normal',
        bypass: false,
        problem: false,
        encounters: normalLoad(),
        failedMoves: [
            { id: 'm1', who: 'วิไล', origin: 'สถานี 2', destination: 'ห้อง 650010518', reason: 'ห้องปลายทางยังไม่เปิด', at: '10:42' }
        ],
        // Patients in their own room with no encounter, and what the HIS said of their appointments today (ADR 0019).
        unqueued: [
            { hn: '650012001', appointment: 'none', waited: 340 },
            { hn: '650012002', appointment: 'unreadable', waited: 75 }
        ],
        // Moves under way, with how long ago each started.
        moves: [
            { id: 'mv1', who: 'ปรีชา', origin: 'ห้องตรวจ 3', destination: 'ห้อง 650010259', started: 25 },
            { id: 'mv2', who: 'สมศรี', origin: 'สถานี 1', destination: 'ห้อง 650010222', started: 80 }
        ],
        backend: false,
        clinic: '',
        statsOpen: false,
        elapsed: 0,
        selected: null,
        panelTab: 'act',
        target: null,
        targetFor: null,
        attnOpen: false,
        popover: null,
        roomHint: null
    };

    // ---------- Helpers ----------
    function el(tag, cls, text) {
        const node = document.createElement(tag);

        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;

        return node;
    }

    function icon(name) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');

        svg.setAttribute('class', 'i');
        svg.setAttribute('aria-hidden', 'true');
        use.setAttribute('href', `#i-${name}`);
        svg.appendChild(use);

        return svg;
    }

    function btn(text, cls, iconName, onClick) {
        const b = el('button', cls);

        b.type = 'button';
        if (iconName) b.appendChild(icon(iconName));
        if (text) b.appendChild(el('span', undefined, text));
        b.addEventListener('click', e => { e.stopPropagation(); onClick?.(e); });

        return b;
    }

    const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const tier = s => s >= WAIT_LONG ? 'long' : s >= WAIT_WARN ? 'warn' : '';
    const nhsoOf = e => state.bypass ? 'bypassed' : e.nhso;
    const stageIndex = id => STAGES.findIndex(s => s[0] === id);
    const isLast = e => stageIndex(e.stage) === STAGES.length - 1;
    const nextName = e => isLast(e) ? 'เสร็จสิ้น' : STAGES[stageIndex(e.stage) + 1][1];
    const byStage = id => state.encounters.filter(e => e.stage === id).sort((a, b) => b.waited - a.waited);
    const isD = () => state.variant === 'D';

    // ---------- D's infographics: wait tiers per stage, and one patient's wait against the limit ----------
    // Each tier is a status: it always ships with its icon and its label, never colour alone.
    const TIERS = [ [ 'ok', 'ไม่ถึง 5 นาที', 'check' ], [ 'warn', '5–15 นาที', 'clock' ], [ 'long', 'เกิน 15 นาที', 'alert' ] ];
    const tierCounts = list => {
        const c = { ok: 0, warn: 0, long: 0 };

        list.forEach(e => { c[tier(e.waited) || 'ok'] += 1; });

        return c;
    };

    function tierBar(list) {
        const bar = el('div', 'pv-tierbar');
        const c = tierCounts(list);

        bar.setAttribute('role', 'img');
        bar.setAttribute('aria-label', TIERS.map(([ k, label ]) => `${label} ${c[k]} ราย`).join(', '));
        TIERS.forEach(([ k, label ]) => {
            if (!c[k]) return;
            const seg = el('span', `seg ${k}`);

            seg.style.flexGrow = String(c[k]);
            seg.title = `${label}: ${c[k]} ราย (${Math.round(c[k] * 100 / list.length)}%)`;
            bar.appendChild(seg);
        });

        return bar;
    }

    /** Under a column's title: its wait tiers as a thin bar, the longest wait, and how many are past the limit. */
    function colStats(id) {
        const list = byStage(id).filter(shown);
        const box = el('div', 'pv-col-stats');
        const line = el('div', 'pv-col-line');
        const longest = el('span', 'pv-col-fact');
        const long = list.filter(e => e.waited >= WAIT_LONG).length;

        box.dataset.stage = id;
        longest.dataset.tier = tier(list[0]?.waited ?? 0);
        longest.append(icon('clock'), el('span', undefined, `นานสุด ${mmss(list[0]?.waited ?? 0)}`));
        line.appendChild(longest);
        if (long) {
            const over = el('span', 'pv-col-fact over');

            over.append(icon('alert'), el('span', undefined, `เกินเกณฑ์ ${long}`));
            line.appendChild(over);
        }
        const team = TEAMS.find(t => t.stageIds.includes(id));

        if (team) {
            const free = team.free.length;
            // Callable: nobody is with them yet, and they are in their room to be called.
            const unserved = list.filter(e => !e.at?.length && !e.absent).length;
            const staff = el('span', 'pv-col-fact staff');
            const [ mood, text ] = free && unserved ? [ 'idle', `ว่าง ${free} คน เรียกได้` ]
                : !free && unserved ? [ 'none', 'ไม่มีคนว่าง' ] : [ '', `ว่าง ${free} คน` ];

            staff.dataset.mood = mood;
            staff.title = `${team.id}: ว่าง ${team.free.join(', ') || '—'} · ไม่ว่าง ${
                team.busy.map(b => b[0]).join(', ') || '—'}`;
            staff.append(icon('users'), el('span', undefined, text));
            line.appendChild(staff);
        }
        box.append(tierBar(list), line);

        return box;
    }

    /** One legend for every column's bar, with the whole board's count per tier. */
    function boardLegend() {
        const legend = el('div', 'pv-tier-legend');
        const c = tierCounts(state.encounters);

        legend.appendChild(el('span', 'pv-tier-legend-title', 'เวลารอ'));
        TIERS.forEach(([ k, label, iconName ]) => {
            const item = el('span', `pv-tier-key ${k}`);

            item.append(el('i', 'swatch'), icon(iconName), el('span', undefined, label), el('b', undefined, String(c[k])));
            legend.appendChild(item);
        });

        return legend;
    }

    /** The panel's wait meter: filled to the 15-minute limit, a tick at 5 minutes, the fill colour is the severity. */
    function waitMeter(e) {
        const m = el('div', 'pd-meter');
        const top = el('div', 'pd-meter-top');
        const label = el('span', 'pd-meter-label');
        const value = el('span', 'pd-meter-value');
        const track = el('div', 'pd-track');
        const scale = el('div', 'pd-scale');

        m.dataset.enc = e.id;
        m.dataset.tier = tier(e.waited);
        label.append(icon('clock'), el('span', undefined, 'รอมาแล้ว'));
        value.append(el('b', 'pv-wait', mmss(e.waited)), el('span', 'pd-meter-of', ' / 15:00 นาที'));
        top.append(label, value);
        track.append(el('span', 'pd-fill'), el('span', 'pd-tick'));
        scale.append(el('span', undefined, '0'), el('span', 'five', '5'), el('span', undefined, '15'));
        m.append(top, track, scale, el('div', 'pd-meter-cap'));
        paintMeter(m, e);

        return m;
    }

    function paintMeter(m, e) {
        const t = tier(e.waited);
        const over = Math.floor((e.waited - WAIT_LONG) / 60);
        const [ iconName, text ] = t === 'long' ? [ 'alert', `เกินเกณฑ์ 15 นาทีมาแล้ว ${over} นาที` ]
            : t === 'warn' ? [ 'clock', `เกิน 5 นาที อีก ${Math.ceil((WAIT_LONG - e.waited) / 60)} นาทีถึงเกณฑ์` ]
                : [ 'check', 'ยังไม่ถึง 5 นาที' ];

        m.querySelector('.pd-fill').style.width = `${Math.min(100, e.waited * 100 / WAIT_LONG)}%`;
        m.querySelector('.pd-meter-cap').replaceChildren(icon(iconName), el('span', undefined, text));
    }

    const MOVE_STUCK = 60;
    const withBackend = () => isD() && state.backend;
    const shown = e => !withBackend() || !state.clinic || e.clinic === state.clinic;
    const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
    const totalOf = e => e.waited + Object.values(e.history).reduce((a, b) => a + b, 0);
    const lateOf = e => e.appt === undefined ? 0 : Math.floor(NOW + state.elapsed / 60 - e.appt);
    const hm = sec => sec >= 3600 ? `${Math.floor(sec / 3600)} ชม. ${Math.floor(sec % 3600 / 60)} นาที` : `${Math.floor(sec / 60)} นาที`;
    const APPT_LATE = 30;
    const LONG_TOTAL = 90 * 60;

    /** Above the board: the clinic filter, and the button for today's figures. */
    function boardBar() {
        const bar = el('div', 'pv-boardbar');
        const seg = el('div', 'segmented pv-clinics');
        const count = c => state.encounters.filter(e => !c || e.clinic === c).length;

        bar.appendChild(el('span', 'pv-boardbar-label', 'คลินิก'));
        [ [ '', 'ทุกคลินิก' ], ...Object.entries(CLINICS) ].forEach(([ id, name ]) => {
            const b = btn('', '', undefined, () => { state.clinic = id; render(); });

            b.append(el('span', undefined, name), el('span', 'count', String(count(id))));
            b.setAttribute('aria-pressed', String(state.clinic === id));
            seg.appendChild(b);
        });
        bar.appendChild(seg);

        // The header has no room for a fifth figure: today's completions ride on the button that opens today's figures.
        const stats = btn(`สถิติวันนี้ · เสร็จ ${HOURS.reduce((a, h) => a + h[2], 0)}`, 'secondary pv-stats-btn', 'chart', () => { state.statsOpen = !state.statsOpen; render(); });

        stats.setAttribute('aria-expanded', String(state.statsOpen));
        bar.appendChild(stats);

        return bar;
    }

    // Today's figures. The backend keeps every encounter of the day with its history, so all of it is a query away;
    // the prototype makes up the hours before it opened.
    const HOURS = [ [ '08:00', 12, 4 ], [ '09:00', 18, 14 ], [ '10:00', 15, 16 ], [ '11:00', 4, 3 ] ];

    function todayStats() {
        const box = el('section', 'pv-today');
        const tiles = el('div', 'pv-today-tiles');
        const tile = (iconName, label, value, note) => {
            const t = el('div', 'pv-today-tile');
            const ic = el('span', 'pv-fig-ic');

            ic.appendChild(icon(iconName));
            t.append(ic, el('b', undefined, value), el('span', 'label', label));
            if (note) t.appendChild(el('span', 'note', note));
            tiles.appendChild(t);
        };
        const done = HOURS.reduce((a, h) => a + h[2], 0);
        const arrived = HOURS.reduce((a, h) => a + h[1], 0);

        tile('check', 'เสร็จวันนี้', String(done), `จาก ${arrived} ราย ที่เข้ามา`);
        tile('hourglass', 'เวลาเฉลี่ยทั้ง encounter', '1 ชม. 12 นาที', 'ของที่เสร็จแล้ววันนี้');
        tile('clock', 'รอนานสุดวันนี้', '41 นาที', 'พบแพทย์ 09:42');

        // Average wait per stage, against the 15-minute limit.
        const avg = el('div', 'pv-chart');
        const rows = el('div', 'pv-hbars');
        const perStage = STAGES.map(([ id, name ]) => {
            const waits = state.encounters.map(e => e.history[id]).filter(x => x !== undefined)
                .concat(state.encounters.filter(e => e.stage === id).map(e => e.waited));

            return [ name, waits.length ? waits.reduce((a, b) => a + b, 0) / waits.length : 0 ];
        });
        const max = Math.max(WAIT_LONG * 1.4, ...perStage.map(x => x[1]));

        avg.append(el('h3', undefined, 'เวลารอเฉลี่ยต่อขั้น (นาที)'), rows);
        perStage.forEach(([ name, sec ]) => {
            const row = el('div', 'pv-hbar');
            const track = el('span', 'track');
            const fill = el('span', `fill ${tier(sec) || 'ok'}`);
            const limit = el('span', 'limit');

            fill.style.width = `${sec * 100 / max}%`;
            limit.style.left = `${WAIT_LONG * 100 / max}%`;
            track.append(fill, limit);
            row.title = `${name}: เฉลี่ย ${(sec / 60).toFixed(1)} นาที`;
            row.append(el('span', 'name', name), track, el('span', 'val', (sec / 60).toFixed(1)));
            rows.appendChild(row);
        });
        avg.appendChild(el('p', 'pv-chart-note', 'เส้นประคือเกณฑ์ 15 นาที'));

        // Arrivals and completions per hour.
        const hourly = el('div', 'pv-chart');
        const legend = el('div', 'pv-chart-legend');
        const cols = el('div', 'pv-cols');
        const top = Math.max(...HOURS.flatMap(h => [ h[1], h[2] ]));

        [ [ 'in', 'เข้าใหม่' ], [ 'out', 'เสร็จ' ] ].forEach(([ k, label ]) => {
            const item = el('span');

            item.append(el('i', `key ${k}`), el('span', undefined, label));
            legend.appendChild(item);
        });
        HOURS.forEach(([ hour, inN, outN ], i) => {
            const group = el('div', 'pv-col-group');
            const bars = el('div', 'bars');

            [ [ 'in', inN, 'เข้าใหม่' ], [ 'out', outN, 'เสร็จ' ] ].forEach(([ k, n, label ]) => {
                const bar = el('span', `bar ${k}`);

                bar.style.height = `${n * 100 / top}%`;
                bar.title = `${hour}: ${label} ${n} ราย`;
                bar.appendChild(el('span', 'v', String(n)));
                bars.appendChild(bar);
            });
            group.append(bars, el('span', 'hour', i === HOURS.length - 1 ? `${hour} (ถึงตอนนี้)` : hour));
            cols.appendChild(group);
        });
        hourly.append(el('h3', undefined, 'เข้าใหม่และเสร็จ ต่อชั่วโมง'), legend, cols);

        box.append(tiles, avg, hourly);

        return box;
    }
    const APPOINTMENT = { none: [ 'clipboard', 'ไม่มีนัดวันนี้' ], all_seen: [ 'check', 'พบครบทุกนัดแล้ว' ],
        unreadable: [ 'alert', 'อ่านนัดจาก HIS ไม่ได้' ] };

    /** Patients in their own room that no queue holds: nobody calls them until a coordinator starts their encounter. */
    function unqueuedStrip() {
        if (!state.unqueued.length) return null;
        const strip = el('section', 'pv-unq');
        const head = el('div', 'pv-unq-head');
        const list = el('div', 'pv-unq-list');

        head.append(icon('door'), el('span', undefined, 'อยู่ในห้องแต่ยังไม่เข้าคิว'),
            el('span', 'count', String(state.unqueued.length)));
        state.unqueued.forEach(u => {
            const card = el('div', 'pv-unq-card');
            const wait = el('span', 'pv-waitbox');
            const [ iconName, text ] = APPOINTMENT[u.appointment];
            const badge = el('span', `badge appt-${u.appointment}`);

            card.dataset.uq = u.hn;
            card.dataset.tier = tier(u.waited);
            wait.append(icon('clock'), el('span', 'pv-wait', mmss(u.waited)));
            badge.append(icon(iconName), el('span', undefined, text));
            card.append(el('b', 'pv-unq-hn', u.hn), wait, badge, btn('เข้าคิว', 'primary pv-unq-go', 'plus', () => {
                state.unqueued = state.unqueued.filter(x => x !== u);
                state.encounters.push(encounter('waiting', 0, { hn: u.hn }));
                render();
            }));
            list.appendChild(card);
        });
        strip.append(head, list);

        return strip;
    }

    // Which icon each badge and each attention item wears.
    const BADGE_ICON = { appt: 'calendar', late: 'calendar', total: 'hourglass', unrec: 'recoff', absent: 'useroff', qwait: 'clipboard', qdone: 'clipboard', next: 'arrow', at: 'users', 'nhso-not_yet': 'key', 'nhso-unavailable': 'key', 'nhso-bypassed': 'key',
        video: 'play' };

    // ---------- Attention: one list, every variant shows it its own way ----------
    function attention() {
        const items = [];

        if (state.problem) {
            items.push({ key: 'problem', sev: 'high', icon: 'alert', text: 'เชื่อมต่อฐานข้อมูลไม่ได้ หน้าจออาจไม่อัปเดต', count: 1 });
        }
        const unrecorded = isD() ? state.encounters.filter(e => e.unrecorded) : [];

        if (unrecorded.length) {
            items.push({ key: 'unrec', sev: 'high', icon: 'recoff', count: unrecorded.length, enc: unrecorded[0].id,
                text: `ไม่ได้บันทึกหลักฐาน ${unrecorded.length} ห้อง: HN ${unrecorded.map(e => e.hn).join(', ')}` });
        }
        state.failedMoves.forEach(m => items.push({ key: m.id, sev: 'high', icon: 'swap', count: 1, dismiss: true, room: true,
            text: `ย้าย ${m.who} ไป ${m.destination} ไม่สำเร็จ: ${m.reason} (${m.at})` }));
        if (isD() && state.unqueued.length) {
            items.push({ key: 'unq', sev: 'high', icon: 'door', count: state.unqueued.length, unq: true,
                text: `อยู่ในห้องแต่ยังไม่เข้าคิว ${state.unqueued.length} ราย: HN ${
                    state.unqueued.map(u => u.hn).join(', ')}` });
        }
        if (state.variant === 'D') {
            // Q25: one item per stage for the long waits, pointing at the longest one.
            STAGES.forEach(([ id, name ]) => {
                const long = byStage(id).filter(e => e.waited >= WAIT_LONG);

                if (long.length) {
                    items.push({ key: `long-${id}`, sev: 'high', icon: 'clock', count: 1, enc: long[0].id,
                        text: `รอนานเกิน 15 นาที: ${name} ${long.length} ราย (นานสุด HN ${long[0].hn} ${
                            Math.floor(long[0].waited / 60)} นาที)` });
                }
            });
        } else {
            state.encounters.filter(e => e.waited >= WAIT_LONG)
                .forEach(e => items.push({ key: `long-${e.id}`, sev: 'high', count: 1, enc: e.id,
                    text: `HN ${e.hn} รอ ${Math.floor(e.waited / 60)} นาที ที่ ${STAGE_NAME[e.stage]}` }));
        }

        const unavailable = state.encounters.filter(e => nhsoOf(e) === 'unavailable');
        const notYet = state.encounters.filter(e => nhsoOf(e) === 'not_yet');
        const noDoctor = state.encounters.filter(e => e.stage === 'examination' && !e.doctor);

        if (unavailable.length) {
            items.push({ key: 'nhso-u', sev: 'high', icon: 'key', count: unavailable.length, enc: unavailable[0].id,
                text: `สปสช. ตรวจไม่ได้ ${unavailable.length} ราย: ${unavailable.map(e => e.hn).join(', ')}` });
        }
        const absent = isD() ? state.encounters.filter(e => e.absent) : [];

        if (absent.length) {
            items.push({ key: 'absent', sev: 'mid', icon: 'useroff', count: absent.length, enc: absent[0].id,
                text: `คนไข้ไม่อยู่ในห้อง ${absent.length} ราย: HN ${absent.map(e => e.hn).join(', ')}` });
        }
        if (noDoctor.length) {
            items.push({ key: 'nodoc', sev: 'mid', icon: 'stethoscope', count: noDoctor.length, enc: noDoctor[0].id,
                text: `พบแพทย์: ${noDoctor.length} รายยังไม่มีแพทย์` });
        }
        if (notYet.length) {
            items.push({ key: 'nhso-n', sev: 'mid', icon: 'key', count: notYet.length, enc: notYet[0].id,
                text: `สปสช. ยังไม่ยืนยัน ${notYet.length} ราย` });
        }

        return items;
    }

    function flagged(e) {
        return e.waited >= WAIT_LONG || nhsoOf(e) === 'unavailable' || (isD() && e.unrecorded) || (e.stage === 'examination' && !e.doctor);
    }

    function actOnItem(item) {
        if (item.unq) {
            state.view = 'queue';
            render();
            document.querySelector('.pv-unq')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            return;
        }
        if (item.room) {
            state.view = 'rooms';
            state.roomHint = 'ห้อง 650010518';
        } else if (item.enc) {
            state.view = 'queue';
            state.selected = item.enc;
        }
        render();
    }

    function dismiss(item) {
        if (item.key === 'problem') state.problem = false;
        state.failedMoves = state.failedMoves.filter(m => m.id !== item.key);
        render();
    }

    // ---------- Actions (memory only) ----------
    function forward(e, to) {
        const target = to ?? (isLast(e) ? 'done' : STAGES[stageIndex(e.stage) + 1][0]);

        state.targetFor = null;

        if (target === 'done') {
            state.encounters = state.encounters.filter(x => x !== e);
            if (state.selected === e.id) state.selected = null;
        } else {
            e.stage = target;
            e.waited = 0;
            e.at = undefined;
            e.suggested = false;
        }
        render();
    }

    function select(e) {
        state.selected = state.selected === e.id ? null : e.id;
        render();
    }

    function showRoom(e) {
        state.view = 'rooms';
        state.roomHint = `ห้อง ${e.hn}`;
        render();
    }

    // ---------- Header ----------
    function drawHeader() {
        const figures = document.getElementById('figures');
        const count = id => state.encounters.filter(e => e.stage === id).length;
        const fig = (iconName, label, value) => {
            const f = el('span', 'pv-figure');

            const tile = el('span', 'pv-fig-ic');

            tile.appendChild(icon(iconName));
            f.append(tile, el('span', 'pv-fig-label', label), el('b', undefined, String(value)));

            return f;
        };

        figures.replaceChildren(
            fig('clock', 'รอคิว', count('waiting')),
            fig('stethoscope', 'ระหว่างบริการ', state.encounters.length - count('waiting')),
            fig('door', 'ห้องเปิด', 23),
            fig('swap', 'กำลังย้าย', state.moves.length)
        );

        const stuck = state.moves.filter(m => m.started >= MOVE_STUCK);
        const movesFig = figures.lastChild;

        movesFig.title = state.moves.map(m => `${m.who}: ${m.origin} → ${m.destination} (${m.started} วินาที)`).join('\n');
        movesFig.onclick = () => { state.view = 'rooms'; render(); };
        if (isD() && stuck.length) {
            const warn = el('span', 'pv-fig-warn');

            movesFig.dataset.stuck = 'true';
            warn.append(icon('alert'), el('span', undefined, `ค้าง ${stuck.length}`));
            movesFig.appendChild(warn);
        }

        const chip = document.getElementById('nhso-chip');

        chip.dataset.on = String(state.bypass);
        chip.replaceChildren(icon('key'), el('span', undefined, state.bypass ? 'วันนี้ bypass สปสช.' : 'สปสช. ปกติ'));
        if (state.popover === 'nhso') {
            const pop = el('div', 'pv-pop');

            pop.append(el('p', undefined, state.bypass
                ? 'ประกาศ bypass วันนี้แล้ว (สุดา 08:12): สปสช. นับทุกการมารับบริการของวันนี้ว่ายืนยันแล้ว'
                : 'ถ้า API ของ สปสช. ล่มทั้งวัน ให้ประกาศ bypass'));
            pop.append(btn(state.bypass ? 'ยกเลิก bypass วันนี้' : 'ประกาศ bypass วันนี้', 'secondary', undefined, () => {
                state.bypass = !state.bypass;
                state.popover = null;
                render();
            }));
            pop.addEventListener('click', e => e.stopPropagation());
            chip.appendChild(pop);
        }
        chip.onclick = e => {
            e.stopPropagation();
            state.popover = state.popover === 'nhso' ? null : 'nhso';
            render();
        };

        document.querySelectorAll('#views button').forEach(b => {
            b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
            b.onclick = () => { state.view = b.dataset.view; render(); };
        });

        const n = attnTotal(attention());

        document.title = n ? `(${n}) หน้าจอผู้ประสานงาน` : 'หน้าจอผู้ประสานงาน';
    }

    // ---------- Team strip ----------
    function drawTeams() {
        const strip = el('div', 'pv-teams');

        const label = el('span', 'pv-teams-label');

        label.append(icon('users'), el('span', undefined, 'ทีม'));
        strip.appendChild(label);
        TEAMS.forEach(t => {
            const chip = el('span', 'pv-team');

            const avail = el('span', 'pv-avail');

            t.free.forEach(n => { const d = el('i', 'free'); d.title = `${n}: ว่าง`; avail.appendChild(d); });
            t.busy.forEach(([ n, hn ]) => { const d = el('i', 'busy'); d.title = `${n}: กับ ${hn}`; avail.appendChild(d); });
            chip.append(el('b', undefined, t.id), avail, el('span', 'free', `ว่าง ${t.free.length}`),
                el('span', 'busy', `ไม่ว่าง ${t.busy.length}`));
            chip.onclick = e => {
                e.stopPropagation();
                state.popover = state.popover === t.id ? null : t.id;
                render();
            };
            if (state.popover === t.id) {
                const pop = el('div', 'pv-pop');

                pop.append(el('p', undefined, `ขั้น: ${t.stages}`),
                    el('p', undefined, `ว่าง: ${t.free.join(', ') || '—'}`),
                    el('p', undefined, `ไม่ว่าง: ${t.busy.map(([ n, hn ]) => `${n} (กับ ${hn})`).join(', ') || '—'}`));
                chip.appendChild(pop);
            }
            strip.appendChild(chip);
        });

        return strip;
    }

    // ---------- Board: shared frame, each variant draws the tickets ----------
    function drawBoard(drawTicket, ticketsInto) {
        const board = el('div', 'pv-board');
        const columns = [];

        STAGES.forEach(([ id, name, iconName ]) => {
            const entries = byStage(id).filter(shown);

            if (!entries.length) {
                const col = el('div', 'pv-col collapsed');

                col.title = `${name}: ไม่มีผู้ป่วย`;
                col.append(el('span', 'count', '0'), el('span', 'pv-vname', name));
                board.appendChild(col);
                columns.push('2.8rem');

                return;
            }

            const col = el('div', 'pv-col');
            const head = el('div', 'pv-col-head');
            const body = el('div', 'pv-col-body');

            head.append(icon(iconName), el('span', undefined, name), el('span', 'count', String(entries.length)));
            col.append(head);
            if (isD()) col.appendChild(colStats(id));
            col.appendChild(body);
            if (id === 'examination') {
                const groups = [ ...DOCTORS.map(d => [ `แพทย์ ${d}`, entries.filter(e => e.doctor === d), '' ]),
                    [ 'ยังไม่กำหนดแพทย์', entries.filter(e => !e.doctor), 'none' ] ];

                groups.filter(g => g[1].length).forEach(([ title, list, cls ]) => {
                    const h = el('div', `pv-doctor ${cls}`);

                    h.append(el('span', undefined, title), el('span', undefined, `(${list.length})`));
                    body.appendChild(h);
                    ticketsInto(body, list.map((e, i) => drawTicket(e, i)));
                });
            } else {
                ticketsInto(body, entries.map((e, i) => drawTicket(e, i)));
            }
            board.appendChild(col);
            columns.push('minmax(var(--col-min, 14rem), 1fr)');
        });
        board.style.gridTemplateColumns = columns.join(' ');

        return board;
    }

    function hnLink(e) {
        const b = el('button', 'pv-hn-link pv-hn', e.hn);

        b.type = 'button';
        b.title = 'ไปที่ห้องของผู้ป่วย';
        b.addEventListener('click', ev => { ev.stopPropagation(); showRoom(e); });

        return b;
    }

    function primary(e, compact) {
        const b = btn(compact ? '' : (isLast(e) ? 'เสร็จสิ้น' : 'ส่งต่อ'), 'primary pv-go', isLast(e) ? 'check' : 'arrow',
            () => forward(e));

        b.title = `ส่งต่อไป ${nextName(e)}`;

        return b;
    }

    function mark(node, e) {
        node.dataset.enc = e.id;
        node.dataset.tier = tier(e.waited);
        if (state.selected === e.id) node.classList.add('pv-selected');
        node.addEventListener('click', () => select(e));

        return node;
    }

    function badgesOf(e) {
        const list = [];
        const n = nhsoOf(e);

        if (isD() && e.unrecorded) list.push([ 'unrec', 'ไม่ได้บันทึกหลักฐาน' ]);
        if (isD() && e.absent) list.push([ 'absent', 'คนไข้ไม่อยู่ในห้อง' ]);
        if (e.suggested) list.push([ 'next', 'ถัดไป' ]);
        if (e.at?.length) list.push([ 'at', `อยู่ที่ ${e.at.join(', ')}` ]);
        if (n !== 'authenticated') list.push([ `nhso-${n}`, NHSO[n] ]);
        if (e.playing) list.push([ 'video', 'กำลังเล่นวิดีโอ' ]);
        if (withBackend()) {
            const late = lateOf(e);

            // Only a lateness that still matters earns a badge: past the doctor, the appointment is history.
            if (e.appt !== undefined && late >= APPT_LATE && stageIndex(e.stage) <= stageIndex('examination')) {
                list.push([ 'late', `เลยนัด ${hhmm(e.appt)} มา ${late} นาที` ]);
            }
            if (totalOf(e) >= LONG_TOTAL) list.push([ 'total', `อยู่ในระบบ ${hm(totalOf(e))}` ]);
        }
        if (isD() && e.questionnaires.length) {
            const pending = e.questionnaires.filter(q => !q.answers).length;

            list.push(pending ? [ 'qwait', `รอคำตอบแบบสอบถาม ${pending}` ] : [ 'qdone', 'ตอบแบบสอบถามแล้ว' ]);
        }

        return list;
    }

    // ---------- Detail panel (contents shared) ----------
    function panelSections(e) {
        const sections = {};

        const stageField = el('label', 'pv-field');

        stageRow.append(stagePick, btn('ส่งไปขั้นนี้', 'secondary', 'arrow', () => forward(e, stagePick.value)));
        stageField.append(el('span', undefined, 'เปลี่ยนขั้น'), stageRow);
        act.append(stageField);

        const doneRow = el('div', 'pv-row');

        doneRow.append(btn('เสร็จสิ้น encounter', 'secondary', 'check', () => forward(e, 'done')));

        if (e.stage === 'examination') {

            row.append(input, btn('กำหนดแพทย์', 'secondary', undefined, () => {

            act.append(f);
        }

        const media = el('div', 'pv-panel-body');
        const vf = el('label', 'pv-field');
        const vrow = el('div', 'pv-row');

            o.value = v.id;
            vpick.appendChild(o);
        });

        vrow.append(vpick, btn(e.playing ? 'หยุดวิดีโอ' : 'เล่นวิดีโอ', e.playing ? 'primary' : 'secondary',

                e.video = vpick.value;
                e.playing = !e.playing;
                render();
            }));
        vf.append(el('span', undefined, 'วิดีโอระหว่างรอ'), vrow);
        media.append(vf);

        const qs = el('div', 'pv-panel-body');
        const qf = el('label', 'pv-field');
        const qrow = el('div', 'pv-row');
        const qpick = el('select');

        QUESTIONNAIRES.forEach(q => {
            const o = el('option', undefined, q.title);

            o.value = q.id;
            qpick.appendChild(o);
        });
        qrow.append(qpick, btn('ส่ง', 'secondary', undefined, () => {
            e.questionnaires.push({ id: qpick.value });
            render();
        }));
        qf.append(el('span', undefined, 'แบบสอบถามสุขภาพ'), qrow);
        qs.append(qf);
        e.questionnaires.forEach(q => {
            const box = el('div', 'pv-q');
            const title = QUESTIONNAIRES.find(x => x.id === q.id).title;

            box.append(el('div', undefined, title),
                el('div', 'state', q.answers ? 'ตอบแล้ว' : 'ส่งแล้ว ยังไม่ตอบ'));
            if (q.answers) {
                const ol = el('ol');

                q.answers.forEach(a => ol.appendChild(el('li', undefined, a)));
                box.appendChild(ol);
            }
            qs.appendChild(box);
        });
        if (!e.questionnaires.length) qs.appendChild(el('div', 'pv-q state', 'ยังไม่ได้ส่งแบบสอบถาม'));

        sections.act = act;
        sections.media = media;
        sections.qs = qs;

        return sections;

    function panelHead(e) {
        const head = el('div', 'pv-panel-head');
        const left = el('div');
        const badges = el('div', 'pv-badges');

        badgesOf(e).forEach(([ cls, text ]) => badges.appendChild(el('span', `badge ${cls}`, text)));
        left.append(hnLink(e), el('div', 'pv-wait', `${STAGE_NAME[e.stage]} · รอ ${mmss(e.waited)}`), badges);

    function stackedPanel(e) {
        const panel = el('aside', 'pv-panel');
        const s = panelSections(e);
        const body = el('div', 'pv-panel-body');

        body.append(s.act, s.media, s.qs);
        [ s.act, s.media, s.qs ].forEach(x => { x.style.padding = '0'; });
        panel.append(panelHead(e), body);
        panel.addEventListener('click', ev => ev.stopPropagation());

        return panel;
    }

    // ---------- Variant A: calm board ----------
    const VariantA = {
        name: 'บอร์ดการ์ด',
        attention(root, items) {
            if (!items.length) return;

            const wrap = el('div', 'pv-attn');

            items.forEach(item => {
                const chip = el('span', 'pv-attn-chip');

                chip.dataset.sev = item.sev;
                chip.append(icon('alert'), el('span', undefined, item.text));
                chip.onclick = () => actOnItem(item);
                if (item.dismiss) {
                    const x = btn('', 'x', 'x', () => dismiss(item));

                    x.title = 'รับทราบ';
                    chip.appendChild(x);
                }
                wrap.appendChild(chip);
            });
            root.appendChild(wrap);
        },
        ticket(e, i) {

            const wait = el('span', 'pv-waitbox');

            if (isD()) wait.appendChild(icon('clock'));
            wait.appendChild(el('span', 'pv-wait', mmss(e.waited)));
            line.append(el('span', 'pv-pos', String(i + 1)), hnLink(e), wait, primary(e, true));
            card.appendChild(line);

            const badges = badgesOf(e);

            // With one clinic picked, every card is that clinic: the tag would say nothing.
            if (withBackend() && !state.clinic) badges.unshift([ 'clinic', CLINICS[e.clinic] ]);
            if (badges.length) {
                const row = el('div', 'pv-badges');

                badges.forEach(([ cls, text ]) => {
                    const b = el('span', `badge ${cls}`);

                    if (isD() && BADGE_ICON[cls]) b.appendChild(icon(BADGE_ICON[cls]));
                    b.appendChild(el('span', undefined, text));
                    row.appendChild(b);
                });
                card.appendChild(row);

                scrim.onclick = () => { state.selected = null; render(); };
                root.append(scrim, stackedPanel(e));

    // ---------- Variant B: dense ledger ----------
    const VariantB = {
        name: 'ตารางแน่น',
        attention(root, items) {
            if (!items.length) return;

            const box = el('details', 'pv-attn');
            const total = attnTotal(items);

                list.appendChild(li);

            box.appendChild(list);

            const legend = el('div', 'pv-legend');

            [ [ 'next', 'ถัดไป' ], [ 'at', 'มีเจ้าหน้าที่อยู่ด้วย' ], [ 'nhso-not_yet', 'สปสช. ยังไม่ยืนยัน' ],
                [ 'nhso-unavailable', 'สปสช. ตรวจไม่ได้' ], [ 'video', 'วิดีโอเล่นอยู่' ] ].forEach(([ cls, text ]) => {

        },
        ticket(e, i) {

                dots.appendChild(d);

        layout(root, board, e) {

            if (e) work.appendChild(stackedPanel(e));
            root.appendChild(work);

    // ---------- Variant C: heat tiles ----------
    const VariantC = {
        name: 'ไทล์ตามเวลารอ',
        attention(root, items) {
            const total = attnTotal(items);
            const banner = el('div', `pv-banner${total ? '' : ' calm'}`);

            if (!total) {
                banner.append(icon('check'), el('span', 'first', 'ไม่มีเรื่องที่ต้องจัดการ'));
                root.appendChild(banner);

                return;
            }
            banner.append(el('span', 'big', String(total)), el('span', 'first', `ต้องจัดการ · ${items[0].text}`));
            banner.appendChild(btn(state.attnOpen ? 'ซ่อน' : `ดูทั้งหมด (${items.length})`, '', undefined, () => {
                state.attnOpen = !state.attnOpen;
                render();
            }));
            root.appendChild(banner);
            if (state.attnOpen) {
                const list = el('div', 'pv-banner-list');

                items.forEach(item => {
                    const row = el('div');

                    row.dataset.sev = item.sev;
                    row.append(icon(item.icon ?? 'alert'), el('span', undefined, item.text));
                    row.onclick = () => actOnItem(item);
                    if (item.dismiss) row.appendChild(btn('รับทราบ', 'ghost x', undefined, () => dismiss(item)));
                    list.appendChild(row);
                });
                root.appendChild(list);

        ticket(e, i) {

                'nhso-bypassed': '' };

            badgesOf(e).forEach(([ cls, text ]) => {
                if (!short[cls]) return;

                const b = el('i', undefined, short[cls]);

                b.title = text;
                corner.appendChild(b);

        layout(root, board, e) {
            const work = el('div', `pv-work${e ? ' has-panel' : ''}`);

            if (e) {

                const tabs = el('div', 'pv-tabs');

                [ [ 'act', 'ดำเนินการ' ], [ 'media', 'วิดีโอ' ], [ 'qs', `แบบสอบถาม (${e.questionnaires.length})` ] ]
                    .forEach(([ key, label ]) => {

                panel.append(panelHead(e), tabs, s[state.panelTab]);

    // ---------- Variant D: the pick (Q24, Q25). A's tickets, C's banner with long waits per stage, A's overlay panel ----------
    const VariantD = {
        name: 'ที่เลือก (A + C)',
        classes: 'vA vC vD',
        attention: (root, items) => VariantC.attention(root, items),
        ticket: (e, i) => VariantA.ticket(e, i),
        layout(root, board, e) {
            const work = el('div', 'pv-work');

            root.querySelector('.pv-teams')?.appendChild(boardLegend());
            const unq = unqueuedStrip();

            if (withBackend()) {
                root.appendChild(boardBar());
                if (state.statsOpen) root.appendChild(todayStats());
            }
            if (unq) root.appendChild(unq);

            work.appendChild(board);
            root.appendChild(work);
            if (e) {
                const scrim = el('div', 'pv-scrim');

                scrim.onclick = () => { state.selected = null; render(); };
                root.append(scrim, panelD(e));
            }
        }
    };

    /**
     * D's panel: facts on top, the pathway as a stepper to pick the stage to send to, doctors as chips, videos and
     * questionnaires as lists with their status, and the action pinned at the bottom.
     */
    function panelD(e) {
        const panel = el('aside', 'pv-panel pd');
        const cur = stageIndex(e.stage);

        panel.addEventListener('click', ev => ev.stopPropagation());
        if (state.targetFor !== e.id) {
            state.target = isLast(e) ? 'done' : STAGES[cur + 1][0];
            state.targetFor = e.id;
        }

        // Head: who, and the facts a coordinator checks first.
        const head = el('div', 'pd-head');
        const top = el('div', 'pd-top');
        const title = el('div', 'pd-title');

        title.append(el('span', 'pd-eyebrow', 'ผู้ป่วย HN'), hnLink(e));
        top.append(title, btn('', 'ghost pd-close', 'x', () => { state.selected = null; render(); }));

        const facts = el('dl', 'pd-facts');
        const fact = (iconName, label, value) => {
            const box = el('div', 'pd-fact');
            const dt = el('dt');

            dt.append(icon(iconName), el('span', undefined, label));
            box.append(dt, el('dd', undefined, value));
            facts.appendChild(box);
        };
        const nhso = nhsoOf(e);

        facts.appendChild(waitMeter(e));
        fact(STAGES[cur][2], 'ขั้นปัจจุบัน', STAGE_NAME[e.stage]);
        fact('stethoscope', 'แพทย์', e.doctor ?? (e.stage === 'examination' ? 'ยังไม่กำหนด' : '—'));
        fact('key', 'สปสช.', NHSO[nhso].replace('สปสช. ', ''));
        facts.lastChild.dataset.nhso = nhso;
        if (withBackend()) {
            fact('clipboard', 'คลินิก', CLINICS[e.clinic]);
            fact('hourglass', 'อยู่ในระบบมาแล้ว', hm(totalOf(e)));
            if (e.appt !== undefined) {
                const late = lateOf(e);

                fact('calendar', 'นัด', late > 0 ? `${hhmm(e.appt)} · เลยมา ${late} นาที` : `${hhmm(e.appt)} · อีก ${-late} นาที`);
                if (late >= APPT_LATE) facts.lastChild.dataset.late = 'true';
            }
        }
        if (e.at?.length) fact('users', 'เจ้าหน้าที่อยู่ด้วย', e.at.join(', '));
        const alerts = el('div', 'pd-alerts');

        if (e.unrecorded) {
            const a = el('div', 'pd-alert high');

            a.append(icon('recoff'), el('span', undefined, 'ห้องนี้ไม่ได้บันทึกหลักฐาน: recorder bot หลุดและไม่มีตัวอื่นรับต่อ'));
            alerts.appendChild(a);
        }
        if (e.absent) {
            const a = el('div', 'pd-alert mid');

            a.append(icon('useroff'), el('span', undefined, 'คนไข้ไม่อยู่ในห้องตอนนี้: ส่งเจ้าหน้าที่ไปจะไม่พบใคร'));
            alerts.appendChild(a);
        }
        head.append(top);
        if (alerts.childElementCount) head.appendChild(alerts);
        head.appendChild(facts);

        // Body: one section per job.
        const body = el('div', 'pd-body');
        const section = (iconName, title, hint) => {
            const s = el('section', 'pd-section');
            const h = el('h3', 'pd-h');

            h.append(icon(iconName), el('span', undefined, title));
            s.appendChild(h);
            if (hint) s.appendChild(el('p', 'pd-hint', hint));
            body.appendChild(s);

            return s;
        };

        const steps = el('ol', 'pd-steps');

        STAGES.forEach(([ id, name ], i) => {
            const li = el('li', 'pd-step');
            const mark = el('span', 'pd-mark');

            li.dataset.state = i < cur ? 'past' : i === cur ? 'current' : 'future';
            if (i < cur) mark.appendChild(icon('check')); else mark.textContent = String(i + 1);
            li.append(mark, el('span', 'pd-step-name', name));
            if (withBackend() && i < cur) {
                const dur = e.history[id];
                const d = el('span', `pd-dur ${tier(dur) || 'ok'}`);

                d.append(el('i', 'pd-dur-bar'), el('span', undefined, `${Math.round(dur / 60)} นาที`));
                d.firstChild.style.width = `${Math.min(100, dur * 100 / WAIT_LONG) * .045}rem`;
                d.title = `อยู่ในขั้น ${name} ${Math.round(dur / 60)} นาที`;
                li.appendChild(d);
            }
            if (i === cur) {
                li.appendChild(el('span', 'pd-tag', 'อยู่ที่นี่'));
            } else {
                li.tabIndex = 0;
                li.setAttribute('role', 'button');
                li.onclick = () => { state.target = id; render(); };
                if (state.target === id) {
                    li.classList.add('target');
                    li.appendChild(el('span', 'pd-tag target', 'จะส่งไป'));
                }
            }
            steps.appendChild(li);
        });
        section('swap', 'เปลี่ยนขั้น', 'กดเลือกขั้นที่จะส่งไป แล้วกดปุ่มด้านล่าง').appendChild(steps);

        if (e.stage === 'examination') {
            const s = section('stethoscope', 'แพทย์');
            const chips = el('div', 'pd-chips');
            const chip = (label, value) => {
                const c = btn(label, 'pd-chip', undefined, () => { e.doctor = value; render(); });

                c.setAttribute('aria-pressed', String((e.doctor ?? null) === value));
                chips.appendChild(c);
            };

            DOCTORS.forEach(d => chip(d, d));
            chip('ยังไม่กำหนด', null);

            const other = el('div', 'pd-other');
            const input = el('input');

            input.name = 'doctor';
            input.placeholder = 'รหัสแพทย์อื่น';
            other.append(input, btn('กำหนด', 'secondary', undefined, () => {
                e.doctor = input.value.trim() || undefined;
                render();
            }));
            s.append(chips, other);
        }

        const videos = el('div', 'pd-list');

        VIDEOS.forEach(v => {
            const playing = e.playing && e.video === v.id;
            const row = el('div', `pd-item${playing ? ' playing' : ''}`);

            row.appendChild(el('span', 'pd-item-name', v.title));
            if (playing) {
                row.append(el('span', 'pd-tag', 'กำลังเล่น'),
                    btn('หยุด', 'secondary pd-small', 'x', () => { e.playing = false; render(); }));
            } else {
                row.appendChild(btn('เล่น', 'secondary pd-small', 'play', () => {
                    e.video = v.id;
                    e.playing = true;
                    render();
                }));
            }
            videos.appendChild(row);
        });
        section('play', 'วิดีโอระหว่างรอ').appendChild(videos);

        const forms = el('div', 'pd-list');

        QUESTIONNAIRES.forEach(q => {
            const sent = e.questionnaires.find(x => x.id === q.id);
            const row = el('div', 'pd-item');

            row.appendChild(el('span', 'pd-item-name', q.title));
            if (!sent) {
                row.appendChild(btn('ส่ง', 'secondary pd-small', 'arrow', () => {
                    e.questionnaires.push({ id: q.id });
                    render();
                }));
            } else if (!sent.answers) {
                row.appendChild(el('span', 'pd-tag warn', 'รอคำตอบ'));
            } else {
                const answers = el('ul', 'pd-answers');

                sent.answers.forEach(a => answers.appendChild(el('li', undefined, a)));
                row.append(el('span', 'pd-tag ok', 'ตอบแล้ว'), answers);
            }
            forms.appendChild(row);
        });
        section('clipboard', 'แบบสอบถามสุขภาพ').appendChild(forms);

        // Foot: the action for the stage picked above, always in reach.
        const foot = el('div', 'pd-foot');
        const toDone = state.target === 'done';

        foot.appendChild(btn(toDone ? 'เสร็จสิ้น' : `ส่งไป ${STAGE_NAME[state.target]}`, 'primary pd-go',
            toDone ? 'check' : 'arrow', () => forward(e, state.target)));
        if (!toDone) {
            foot.appendChild(btn('เสร็จสิ้น', 'secondary pd-done', 'check', () => forward(e, 'done')));
        }

        panel.append(head, body, foot);

        return panel;
    }

    /** How many things need attention: in D each item is one thing to deal with; elsewhere each patient counts. */
    function attnTotal(items) {
        return state.variant === 'D' ? items.length : items.reduce((s, i) => s + i.count, 0);
    }

    const VARIANTS = { A: VariantA, B: VariantB, C: VariantC, D: VariantD };
    const KEYS = Object.keys(VARIANTS);

    // ---------- Render ----------
    function render() {
        const v = VARIANTS[state.variant];

        document.body.className = v.classes ?? `v${state.variant}`;
        drawHeader();

        const attn = document.getElementById('attention');
        const content = document.getElementById('content');

        attn.replaceChildren();
        content.replaceChildren();
        if (state.view === 'queue') {
            v.attention(attn, attention());
            content.appendChild(drawTeams());

            const board = drawBoard((e, i) => {
                const node = v.ticket(e, i);

                if (flagged(e)) node.classList.add('pv-flag');

                return node;
            }, v.tickets ?? ((body, nodes) => body.append(...nodes)));
            const e = state.encounters.find(x => x.id === state.selected);

            v.layout(content, board, e);

            const list = el('datalist');

            list.id = 'pv-doctors';
            DOCTORS.forEach(d => { const o = el('option'); o.value = d; list.appendChild(o); });
            content.appendChild(list);
        } else {
            v.attention(attn, attention());

            const box = el('div', 'pv-rooms');

            box.append(el('h2', undefined, 'มุมมอง "ห้องและการย้าย"'),
                el('p', undefined, 'ไม่ได้ทำใน prototype: ย้ายรายการห้อง การค้นหา การย้าย และผลการย้ายล่าสุดมาไว้ที่นี่ตามเดิม'),
                el('p', undefined, state.roomHint ? `จะเลื่อนไปที่ ${state.roomHint} และเน้นห้องนั้น` : ''));
            content.appendChild(box);
        }
        drawSwitch();
    }

    // ---------- Prototype switcher (not part of the design) ----------
    function setVariant(key) {
        state.variant = key;
        state.attnOpen = false;
        const url = new URL(location.href);

        url.searchParams.set('variant', key);
        history.replaceState(null, '', url);
        render();
    }

    function cycle(step) {
        const i = KEYS.indexOf(state.variant);

        setVariant(KEYS[(i + step + KEYS.length) % KEYS.length]);
    }

    function drawSwitch() {
        const bar = document.getElementById('switch');
        const toggle = (label, on, fn) => {
            const b = el('button', undefined, label);

            b.setAttribute('aria-pressed', String(on));
            b.onclick = fn;

            return b;
        };
        const total = attnTotal(attention());

        bar.replaceChildren(
            Object.assign(el('button', undefined, '◀'), { onclick: () => cycle(-1), title: 'variant ก่อนหน้า (←)' }),
            el('span', 'label', `${state.variant} · ${VARIANTS[state.variant].name}`),
            Object.assign(el('button', undefined, '▶'), { onclick: () => cycle(1), title: 'variant ถัดไป (→)' }),
            el('span', 'sep'),
            toggle(state.load === 'heavy' ? 'คนไข้เยอะ' : 'คนไข้ปกติ', state.load === 'heavy', () => {
                state.load = state.load === 'heavy' ? 'normal' : 'heavy';
                state.encounters = state.load === 'heavy' ? heavyLoad() : normalLoad();
                state.selected = null;
                render();
            }),
            ...[ 16, 18, 20 ].map(px => toggle(`${px}px`, state.base === px, () => {
                state.base = px;
                document.documentElement.style.fontSize = `${px}px`;
                render();
            })),
            el('span', 'sep'),
            toggle('bypass', state.bypass, () => { state.bypass = !state.bypass; render(); }),
            toggle('problem', state.problem, () => { state.problem = !state.problem; render(); }),
            toggle('+backend', state.backend, () => { state.backend = !state.backend; state.clinic = ''; render(); }),
            toggle('การย้ายล้มเหลว', state.failedMoves.length > 0, () => {
                state.failedMoves = state.failedMoves.length ? [] : [ { id: `m${Date.now()}`, who: 'วิไล',
                    origin: 'สถานี 2', destination: 'ห้อง 650010518', reason: 'ห้องปลายทางยังไม่เปิด', at: '10:42' } ];
                render();
            }),
            el('span', 'sep'),
            el('span', 'state', `${state.encounters.length} encounters · ต้องจัดการ ${total} · เลือก ${
                state.encounters.find(x => x.id === state.selected)?.hn ?? '—'}`)
        );
    }

    document.addEventListener('keydown', ev => {
        const t = ev.target;

        if (t.closest?.('input, textarea, select, [contenteditable]')) return;
        if (ev.key === 'ArrowLeft') cycle(-1);
        if (ev.key === 'ArrowRight') cycle(1);
        if (ev.key === 'Escape' && state.selected) { state.selected = null; render(); }
    });
    document.addEventListener('click', () => {
        if (state.popover) { state.popover = null; render(); }
    });

    // Waiting times tick like the real screen's 2-second refresh: updated in place, so open controls keep their input.
    setInterval(() => {
        state.encounters.forEach(e => { e.waited += 2; });
        state.unqueued.forEach(u => { u.waited += 2; });
        state.elapsed += 2;
        state.moves.forEach(m => { m.started += 2; });
        document.querySelectorAll('[data-uq]').forEach(node => {
            const u = state.unqueued.find(x => x.hn === node.dataset.uq);

            if (!u) return;
            node.dataset.tier = tier(u.waited);
            node.querySelector('.pv-wait').textContent = mmss(u.waited);
        });
        document.querySelectorAll('[data-enc]').forEach(node => {
            const e = state.encounters.find(x => x.id === node.dataset.enc);

            if (!e) return;
            node.dataset.tier = tier(e.waited);
            node.querySelector('.pv-wait').textContent = mmss(e.waited);
            if (node.classList.contains('pd-meter')) paintMeter(node, e);
        });
        document.querySelectorAll('.pv-col-stats').forEach(n => n.replaceWith(colStats(n.dataset.stage)));
        document.querySelector('.pv-tier-legend')?.replaceWith(boardLegend());
        drawHeader();
        const attn = document.getElementById('attention');

        if (state.view === 'queue' && !attn.contains(document.activeElement)) {
            attn.replaceChildren();
            VARIANTS[state.variant].attention(attn, attention());
        }
        drawSwitch();
    }, 2000);

    const fromUrl = new URLSearchParams(location.search).get('variant');

    state.variant = KEYS.includes(fromUrl) ? fromUrl : 'A';
    render();
    </script>
</body>
</html>
