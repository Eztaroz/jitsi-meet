<!DOCTYPE html>
<html>
<head>
    <!--#include virtual="/base.html" -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--#include virtual="/title.html" -->
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #040404;
            color: #e0e0e0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Leelawadee UI",
                sans-serif;
        }

        .left-layout {
            align-items: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            min-height: 100%;
            padding: 16px;
        }

        .left-card {
            animation: left-pop 240ms ease-out;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            padding: 40px 32px 32px;
            text-align: center;
            width: 100%;
        }

        .left-icon {
            align-items: center;
            background: rgba(34, 102, 220, 0.16);
            border-radius: 50%;
            display: inline-flex;
            height: 88px;
            justify-content: center;
            margin-bottom: 24px;
            width: 88px;
        }

        .left-title {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.35;
            margin: 0 0 8px;
        }

        .left-hint {
            color: #a4b8d1;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }

        .left-rejoin {
            background: #246fe5;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-size: 1.125rem;
            font-weight: 600;
            margin-top: 32px;
            min-height: 56px;
            padding: 12px 24px;
            width: 100%;
        }

        .left-rejoin:hover {
            background: #4687ed;
        }

        .left-rejoin:focus-visible {
            outline: 3px solid #a4b8d1;
            outline-offset: 2px;
        }

        .left-rejoin[hidden] {
            display: none;
        }

        /* The satisfaction survey (static/left-survey.js), in the card under the rejoin button. */
        .sv {
            border-top: 1px solid #3d3d3d;
            margin-top: 28px;
            padding-top: 24px;
        }

        .sv-title {
            color: #ffffff;
            font-size: 1.125rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 4px;
        }

        .sv-hint {
            color: #a4b8d1;
            font-size: 0.875rem;
            margin: 0 0 16px;
        }

        .sv-faces {
            display: flex;
            gap: 4px;
            justify-content: space-between;
        }

        .sv-face {
            align-items: center;
            background: none;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #a4b8d1;
            cursor: pointer;
            display: flex;
            flex: 1;
            flex-direction: column;
            font: inherit;
            font-size: 0.75rem;
            gap: 6px;
            min-width: 0;
            padding: 8px 2px;
            transition: opacity 0.15s;
        }

        .sv-face svg {
            height: auto;
            max-width: 48px;
            width: 100%;
        }

        .sv-face span {
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .sv-faces:has(.is-on) .sv-face:not(.is-on) {
            opacity: 0.45;
        }

        .sv-face.is-on {
            background: rgba(255, 255, 255, 0.06);
            border-color: #4687ed;
            color: #ffffff;
        }

        .sv-more {
            animation: sv-in 0.2s ease-out;
            text-align: left;
        }

        .sv-label {
            color: #e0e0e0;
            display: block;
            font-size: 0.9375rem;
            font-weight: 600;
            margin: 16px 0 8px;
        }

        .sv-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sv-chip {
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 999px;
            color: #e0e0e0;
            cursor: pointer;
            font: inherit;
            font-size: 0.875rem;
            min-height: 40px;
            padding: 6px 14px;
        }

        .sv-chip.is-on {
            background: rgba(36, 111, 229, 0.2);
            border-color: #4687ed;
            color: #ffffff;
        }

        .sv-toggle {
            align-items: center;
            background: none;
            border: 1px dashed #5e6d7a;
            border-radius: 8px;
            color: #a4b8d1;
            cursor: pointer;
            display: flex;
            font: inherit;
            font-size: 0.9375rem;
            gap: 8px;
            justify-content: space-between;
            margin-top: 16px;
            min-height: 48px;
            padding: 8px 14px;
            text-align: left;
            width: 100%;
        }

        .sv-toggle svg {
            flex: none;
        }

        .sv-toggle[aria-expanded="true"] {
            border-style: solid;
            color: #ffffff;
        }

        .sv-toggle[aria-expanded="true"] svg {
            transform: rotate(180deg);
        }

        .sv-details {
            animation: sv-in 0.2s ease-out;
            border-left: 2px solid #3d3d3d;
            margin-top: 12px;
            padding-left: 12px;
        }

        .sv-legend {
            color: #a4b8d1;
            font-size: 0.8125rem;
            margin: 0 0 4px;
        }

        .sv-aspect {
            border-top: 1px solid #2f2f2f;
            padding: 10px 0 4px;
        }

        .sv-legend + .sv-aspect {
            border-top: 0;
        }

        .sv-question {
            color: #e0e0e0;
            font-size: 0.9375rem;
        }

        .sv-dots {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            margin-top: 4px;
        }

        .sv-dot {
            align-items: center;
            background: none;
            border: 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            justify-content: center;
            min-height: 44px;
        }

        .sv-dot i {
            border: 2px solid #5e6d7a;
            border-radius: 50%;
            display: block;
            height: 22px;
            width: 22px;
        }

        .sv-dot.is-on i {
            background: #246fe5;
            border-color: #246fe5;
            box-shadow: inset 0 0 0 4px #1e1e1e;
        }

        .sv-dot em {
            color: #a4b8d1;
            font-size: 0.75rem;
            font-style: normal;
        }

        .sv-comment {
            background: #141414;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #ffffff;
            font: inherit;
            font-size: 1rem;
            padding: 12px;
            resize: vertical;
            width: 100%;
        }

        .sv-comment:focus {
            border-color: #4687ed;
            outline: none;
        }

        .sv-error {
            color: #ff8a8a;
            font-size: 0.875rem;
            margin: 12px 0 0;
        }

        .sv-row {
            align-items: center;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-top: 20px;
        }

        .sv-link {
            background: none;
            border: 0;
            color: #a4b8d1;
            cursor: pointer;
            font: inherit;
            font-size: 0.9375rem;
            min-height: 44px;
            padding: 0 4px;
            text-decoration: underline;
        }

        .sv-send {
            background: #246fe5;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            margin-left: auto;
            min-height: 48px;
            padding: 10px 24px;
        }

        .sv-send:hover {
            background: #4687ed;
        }

        .sv-send:disabled {
            cursor: progress;
            opacity: 0.6;
        }

        .sv button:focus-visible {
            outline: 3px solid #a4b8d1;
            outline-offset: 2px;
        }

        .sv-thanks {
            animation: sv-in 0.2s ease-out;
        }

        @media (max-width: 480px) {
            .left-card {
                padding: 32px 20px 24px;
            }

            .sv {
                margin-top: 24px;
                padding-top: 20px;
            }

            .sv-faces {
                gap: 2px;
            }

            .sv-face {
                border-radius: 10px;
                padding: 6px 0;
            }

            .sv-chips {
                gap: 6px;
            }

            .sv-chip {
                padding: 6px 12px;
            }

            .sv-details {
                padding-left: 8px;
            }

            .sv-row {
                gap: 8px;
            }

            .sv-send {
                padding: 10px 18px;
            }
        }

        @keyframes left-pop {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
        }

        @keyframes sv-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .left-card,
            .sv-more,
            .sv-details,
            .sv-thanks {
                animation: none;
            }
        }
    </style>
    <script src="static/left.js"></script>
    <script src="static/left-survey.js"></script>
</head>
<body>
    <div class="left-layout" id="left-layout">
    <main class="left-card" id="left-page">
        <div class="left-icon" aria-hidden="true">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4687ed" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <path d="M16 17l5-5-5-5"/>
                <path d="M21 12H9"/>
            </svg>
        </div>
        <h1 class="left-title" id="left-title">You have left the room</h1>
        <p class="left-hint" id="left-hint">You can close this page now.</p>
        <button class="left-rejoin" id="left-rejoin" type="button" hidden>Rejoin the room</button>
    </main>
    </div>
</body>
</html>
