# The front web server (ADR 0017): ends TLS, forwards everything to the web server, and shows the maintenance page while the
# web server does not answer (it restarts, or the stack is being deployed). Patients and staff keep the same address.
# The web server behind it speaks plain HTTP on the internal network (DISABLE_HTTPS=1).
# This file is baked into the front image (front/Dockerfile), so a change to it is deployed with the central stack, in the
# night window.

# Docker's resolver, asked at each request: with a fixed name nginx would refuse to start while the web server is down,
# and would keep a stale address after the web server is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $front_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    location = /front-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/tele-meet/certs/cert.crt;
    ssl_certificate_key /etc/tele-meet/certs/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Answers by itself, so that a check can tell the front web server from the web server behind it.
    location = /front-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # While the web server restarts the connection is refused or its name does not resolve (502), or it does not answer in
    # time (504): the maintenance page, with the 503 that says the break is temporary. A 5xx the web server itself sends is
    # passed on as it is (proxy_intercept_errors stays off).
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /usr/share/tele-meet/maintenance;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        add_header X-Maintenance 1 always;
    }

    location / {
        set $web_upstream web:80;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BOSH and the websockets (/xmpp-websocket, /colibri-ws) stay open for hours.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $front_connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        client_max_body_size 50m;
    }
}
