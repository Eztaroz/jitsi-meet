# The security headers of every HTTPS response, set by the front web server alone (front.conf hides the web server's own).
# nginx drops the server's add_header in a location that has an add_header of its own, so front.conf includes this file at
# server level and again in each such location.

# The web server speaks plain HTTP behind the front (DISABLE_HTTPS=1), so docker-jitsi-meet sends no HSTS of its own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Nothing outside this address frames the meeting: patients and staff open their link in the browser.
add_header X-Frame-Options "SAMEORIGIN" always;
# A patient's link carries its token in the query (?jwt=, JWT-CONTRACT.md): with any other policy every request the page makes
# repeats that URL in its Referer, into the access logs and, for a link to another site, out of the hospital.
add_header Referrer-Policy "no-referrer" always;
# The meeting needs the camera, the microphone and screen sharing on this address, and nothing else.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), autoplay=(self), geolocation=(), payment=(), usb=()" always;
# Enforced since 2026-11-16, after a test consultation (staff and patient, bridge channel, WebAssembly, workers) showed no
# violation while it was report-only. A new feature that loads from elsewhere must be added here first.
# Jitsi's index.html runs inline scripts, its bundles use eval, and noise suppression and the virtual background run
# WebAssembly. The page reaches Prosody over a websocket on this address (/xmpp-websocket, /colibri-ws):
# named with $host, because the test stack runs the same image under another address, and older Safari does not count a
# websocket to the page's own address as 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: https://$host wss://$host; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
