# The recorder bot service, as an addition to a docker-jitsi-meet deployment. Copy this file next to that deployment's
# docker-compose.yml and start both:
#
#   docker compose -f docker-compose.yml -f docker-compose.recorder-bot.yml up -d
#
# Build the image first from this fork (recorder-bot/README.md):
#
#   docker build -t recorder-bot:<version> recorder-bot/
#
# Every setting is described in recorder-bot/deploy/README.md. Put the secrets in the deployment's .env, never in this
# file.
services:
    recorder-bot:
        image: ${RECORDER_BOT_IMAGE:-recorder-bot:latest}
        restart: unless-stopped
        # As Playwright recommends for Chromium in a container.
        init: true
        ipc: host
        # Only the hospital's room-creation system should reach the control API. Bind it to an internal address.
        ports:
            - '${RECORDER_BOT_API_BIND:-127.0.0.1}:${RECORDER_BOT_API_PORT:-8090}:${RECORDER_BOT_API_PORT:-8090}'
        environment:
            - RECORDER_BOT_API_PORT=${RECORDER_BOT_API_PORT:-8090}
            - RECORDER_BOT_API_SECRET
            - RECORDER_BOT_EMPTY_ROOM_GRACE_SECONDS
            - RECORDER_BOT_FIRST_JOIN_WAIT_SECONDS
            - RECORDER_BOT_JID=${JIBRI_RECORDER_USER}@${XMPP_HIDDEN_DOMAIN}
            - RECORDER_BOT_PASSWORD=${JIBRI_RECORDER_PASSWORD}
            - RECORDER_BOT_JITSI_URL=${PUBLIC_URL}
            - RECORDER_BOT_MAX_HEIGHT
            - TZ
        depends_on:
            - web
