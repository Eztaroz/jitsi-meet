# Patient HNs can contain "/" (for example 12345/2567), and a patient's link encodes it as %2F
# (https://<jitsi>/12345%2F2567). nginx decodes %2F before it picks a location, so the tenant
# locations would read that path as tenant "12345" and room "2567", and the patient would join a
# different room from the recorder bot. Serve a one-segment path that holds an encoded slash as
# a room without a tenant; jitsi-meet then takes the whole raw segment as the room name.
#
# $request_uri is the raw request, and is the same in the page's server-side includes, so the
# check on the decoded $uri keeps the rewrite from applying again to /index.html and to the
# includes it pulls from static/. A space separates the two: a raw request line cannot hold one.
#
# Include this at server level, before the location blocks. The docker-jitsi-meet web image
# includes /config/nginx-custom/*.conf there.
set $hn_room_paths "$request_uri $uri";
if ($hn_room_paths ~ "^/[^/?# ]*%2[Ff][^/?# ]*(\?[^ ]*)? /(?!(libs|css|static|images|fonts|lang|sounds)/)[^/]*/") {
    rewrite ^ /index.html last;
}
