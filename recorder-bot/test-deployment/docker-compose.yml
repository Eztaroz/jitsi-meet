# Local test deployment for the recorder bot: docker-jitsi-meet's images, serving this fork's own web build, plus the
# recorder bot service. Not for production. See README.md.
name: recorder-bot-test

services:
    web:
        image: jitsi/web:${JITSI_IMAGE_VERSION}
        restart: unless-stopped
        ports:
            - '${HTTP_PORT}:80'
            - '${HTTPS_PORT}:443'
        volumes:
            - ${CONFIG}/web:/config
            # Patient HNs with "/" (recorder-bot/deploy/README.md).
            - ../deploy/nginx/hn-rooms.conf:/config/nginx-custom/hn-rooms.conf:ro
            # The fork's web build (make all) replaces the image's own. The bot page is static/recorder-bot.html.
            - ../../index.html:/usr/share/jitsi-meet/index.html:ro
            - ../../base.html:/usr/share/jitsi-meet/base.html:ro
            - ../../body.html:/usr/share/jitsi-meet/body.html:ro
            - ../../fonts.html:/usr/share/jitsi-meet/fonts.html:ro
            - ../../head.html:/usr/share/jitsi-meet/head.html:ro
            - ../../plugin.head.html:/usr/share/jitsi-meet/plugin.head.html:ro
            - ../../title.html:/usr/share/jitsi-meet/title.html:ro
            - ../../manifest.json:/usr/share/jitsi-meet/manifest.json:ro
            - ../../pwa-worker.js:/usr/share/jitsi-meet/pwa-worker.js:ro
            - ../../libs:/usr/share/jitsi-meet/libs:ro
            - ../../css:/usr/share/jitsi-meet/css:ro
            - ../../static:/usr/share/jitsi-meet/static:ro
            - ../../images:/usr/share/jitsi-meet/images:ro
            - ../../fonts:/usr/share/jitsi-meet/fonts:ro
            - ../../lang:/usr/share/jitsi-meet/lang:ro
            - ../../sounds:/usr/share/jitsi-meet/sounds:ro
        environment:
            - DISABLE_DEEP_LINKING
            - ENABLE_IPV6
            - ENABLE_P2P
            - ENABLE_PREJOIN_PAGE
            - ENABLE_RECORDING
            - ENABLE_WELCOME_PAGE
            - PUBLIC_URL
            - RESOLUTION
            - TZ
            - XMPP_HIDDEN_DOMAIN
        networks:
            meet.jitsi:
        depends_on:
            - jvb

    prosody:
        image: jitsi/prosody:${JITSI_IMAGE_VERSION}
        restart: unless-stopped
        expose:
            - '5222'
            - '5347'
            - '5280'
        volumes:
            - ${CONFIG}/prosody/config:/config
            - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom
        environment:
            - ENABLE_IPV6
            - ENABLE_RECORDING
            - JIBRI_RECORDER_PASSWORD
            - JIBRI_RECORDER_USER
            - JIBRI_XMPP_PASSWORD
            - JICOFO_AUTH_PASSWORD
            - JIGASI_TRANSCRIBER_PASSWORD
            - JIGASI_XMPP_PASSWORD
            - JVB_AUTH_PASSWORD
            - PUBLIC_URL
            - TZ
            - XMPP_HIDDEN_DOMAIN
        networks:
            meet.jitsi:
                aliases:
                    - xmpp.meet.jitsi

    jicofo:
        image: jitsi/jicofo:${JITSI_IMAGE_VERSION}
        restart: unless-stopped
        volumes:
            - ${CONFIG}/jicofo:/config
        environment:
            - ENABLE_RECORDING
            - JICOFO_AUTH_PASSWORD
            - TZ
            - XMPP_HIDDEN_DOMAIN
        depends_on:
            - prosody
        networks:
            meet.jitsi:

    jvb:
        image: jitsi/jvb:${JITSI_IMAGE_VERSION}
        restart: unless-stopped
        ports:
            - '10000:10000/udp'
        volumes:
            - ${CONFIG}/jvb:/config
        environment:
            - JVB_ADVERTISE_IPS
            - JVB_AUTH_PASSWORD
            - JVB_DISABLE_STUN
            - TZ
        depends_on:
            - prosody
        networks:
            meet.jitsi:

    recorder-bot:
        # Built from recorder-bot/Dockerfile. Behind a TLS-inspecting proxy, build it first with the proxy's CA
        # (see README.md); compose then reuses the image.
        image: recorder-bot:local
        build: ..
        restart: unless-stopped
        # As Playwright recommends for Chromium in a container.
        init: true
        ipc: host
        # On the host network the bot reaches the web server on localhost and JVB on the advertised 127.0.0.1.
        network_mode: host
        # Root, so that the service can write to ./evidence and ./spool, which belong to whoever checked the
        # repository out. The tests read the evidence recordings in ./evidence.
        user: root
        # Every instance has a spool of its own, as it would on its own host; they share the storage root.
        volumes:
            - ./evidence:/evidence
            - ./spool/main:/var/lib/recorder-bot/spool
        environment:
            - RECORDER_BOT_API_PORT
            - RECORDER_BOT_API_SECRET
            - RECORDER_BOT_EMPTY_ROOM_GRACE_SECONDS
            - RECORDER_BOT_FIRST_JOIN_WAIT_SECONDS
            - RECORDER_BOT_JID=${JIBRI_RECORDER_USER}@${XMPP_HIDDEN_DOMAIN}
            - RECORDER_BOT_PASSWORD=${JIBRI_RECORDER_PASSWORD}
            - RECORDER_BOT_JITSI_URL=https://localhost:${HTTPS_PORT}
            - RECORDER_BOT_IGNORE_CERTIFICATE_ERRORS=true
            - RECORDER_BOT_STORAGE_ROOT=/evidence
            - RECORDER_BOT_MAX_CONSULTATIONS
            - RECORDER_BOT_MAX_RELAUNCHES
            - RECORDER_BOT_PATIENT_MARKER
            - RECORDER_BOT_STAFF_MARKER
            - RECORDER_BOT_STORE_RETRY_SECONDS
            - RECORDER_BOT_RETENTION_DAYS
            - RECORDER_BOT_RETENTION_SWEEP_SECONDS
        depends_on:
            - web

    # A second instance that records at most one consultation at a time, for the capacity tests.
    recorder-bot-limited:
        extends:
            service: recorder-bot
        volumes:
            - ./spool/limited:/var/lib/recorder-bot/spool
        environment:
            - RECORDER_BOT_API_PORT=${RECORDER_BOT_LIMITED_API_PORT}
            - RECORDER_BOT_MAX_CONSULTATIONS=1

    # A third instance that never relaunches a crashed bot, for the relaunch tests.
    recorder-bot-fragile:
        extends:
            service: recorder-bot
        volumes:
            - ./spool/fragile:/var/lib/recorder-bot/spool
        environment:
            - RECORDER_BOT_API_PORT=${RECORDER_BOT_FRAGILE_API_PORT}
            - RECORDER_BOT_MAX_RELAUNCHES=0

    # A fourth instance, with a storage root of its own, for the storage and the retention tests. The storage tests take
    # its storage root, ./outage/evidence, away and give it back; the service never creates it. The retention tests
    # seed it and its spool with old and recent folders, and it sweeps them often.
    recorder-bot-outage:
        extends:
            service: recorder-bot
        volumes:
            - ./spool/outage:/var/lib/recorder-bot/spool
            - ./outage:/outage
        environment:
            - RECORDER_BOT_API_PORT=${RECORDER_BOT_OUTAGE_API_PORT}
            - RECORDER_BOT_STORAGE_ROOT=/outage/evidence
            - RECORDER_BOT_STORE_RETRY_SECONDS=${RECORDER_BOT_OUTAGE_STORE_RETRY_SECONDS}
            - RECORDER_BOT_RETENTION_SWEEP_SECONDS=${RECORDER_BOT_OUTAGE_RETENTION_SWEEP_SECONDS}

networks:
    meet.jitsi:
